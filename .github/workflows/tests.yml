name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Rebuild the game and check it matches the committed cluster-en-llamas.html
        run: |
          cp cluster-en-llamas.html /tmp/committed.html
          python construir.py
          cmp cluster-en-llamas.html /tmp/committed.html
      - name: All levels can be solved
        run: node tests/niveles.test.js
      - name: The solution shown to the player works when copied
        run: node tests/soluciones.test.js
      - name: Wrong or tricky fixes do not pass
        run: node tests/trampas.test.js
      - name: Cheat sheets cover every level
        run: node tests/chuletas.test.js
      - name: Pipes behave like Linux (grep, head, tail, awk, sed, cut…)
        run: node tests/tuberias.test.js
      - name: The shell inside a Pod behaves like busybox
        run: node tests/shell.test.js
      - name: Every command in the cheat sheets works
        run: node tests/comandos-chuletas.test.js
      - name: The same command written in different valid ways gives the same result
        run: node tests/variantes.test.js
      - name: Every command in the hints works
        run: node tests/pistas.test.js
      - name: Command drill (~12,000 commands)
        run: node tests/simulacro.test.js
