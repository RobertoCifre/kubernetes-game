# Despliega Cluster en Llamas DENTRO de un cluster de Kubernetes de verdad (práctica extra).
# La imagen tiene que estar en un registro al que lleguen los nodos (ECR, GHCR, Docker Hub…). Ver LEEME-DOCKER.md.
# Sustituye <IMAGEN> por su URI, p. ej. 123456789012.dkr.ecr.eu-west-1.amazonaws.com/cluster-en-llamas:3.5
# (en kind/minikube vale la imagen local: kind load docker-image cluster-en-llamas:3.5)
apiVersion: v1
kind: Namespace
metadata:
  name: cluster-en-llamas
  labels:
    pod-security.kubernetes.io/enforce: restricted   # el contenedor es no-root: pasa el nivel más estricto
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cluster-en-llamas
  namespace: cluster-en-llamas
spec:
  replicas: 2
  selector:
    matchLabels: {app: cluster-en-llamas}
  template:
    metadata:
      labels: {app: cluster-en-llamas}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        seccompProfile: {type: RuntimeDefault}
      containers:
      - name: web
        image: <IMAGEN>
        ports:
        - containerPort: 8080
        resources:
          requests: {cpu: 10m, memory: 16Mi}
          limits: {memory: 64Mi}
        readinessProbe:
          httpGet: {path: /, port: 8080}
        livenessProbe:
          httpGet: {path: /, port: 8080}
        securityContext:
          allowPrivilegeEscalation: false
          capabilities: {drop: ["ALL"]}
          readOnlyRootFilesystem: true
        volumeMounts:          # nginx necesita escribir temporales; con rootfs de solo lectura van a emptyDir
        - {name: tmp, mountPath: /tmp}
      volumes:
      - name: tmp
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: cluster-en-llamas
  namespace: cluster-en-llamas
spec:
  selector: {app: cluster-en-llamas}
  ports:
  - port: 80
    targetPort: 8080
