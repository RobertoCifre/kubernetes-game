# nginx para EKS Quest (imagen nginx-unprivileged: escucha en 8080, usuario 101)
server {
    listen       8080;
    listen  [::]:8080;
    server_name  _;
    root   /usr/share/nginx/html;
    index  index.html;
    server_tokens off;

    charset utf-8;
    add_header X-Content-Type-Options nosniff always;
    add_header Cache-Control "no-cache" always;
    add_header Referrer-Policy no-referrer always;
    # El juego es un único HTML sin recursos externos: no necesita cargar nada de fuera
    add_header Content-Security-Policy "default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;

    location = / {
        try_files /index.html =404;
    }
    location / {
        try_files $uri =404;
    }
}
