 Qué tipo crea por defecto en 1.36/1.37 no está comprobado |\n| Con AWS Load Balancer Controller instalado | NLB para Services, ALB para Ingress | Lo recomendado en producción. Desde la v2.5 se hace controlador por defecto de los Services LoadBalancer |\n\n- El balanceador cuesta mientras exista: ALB a 0,0252 $/h más uso. Al borrar el Service se borra el balanceador.\n- `EXTERNAL-IP <pending>` unos minutos es normal. Si no cambia, mira `kubectl describe svc`: suelen ser los tags de las subnets (`kubernetes.io/role/elb=1` para públicos) o permisos.\n- Antes de borrar un cluster, borra los Services LoadBalancer: si no, quedan balanceadores huérfanos cobrando.\n", "CHULETA-SEGURIDAD.md": "# Chuleta de seguridad: IAM, RBAC y Pod Security\n\n## Dos preguntas distintas\n\n| Capa | Pregunta | Error si falla | Dónde se configura |\n|---|---|---|---|\n| IAM (autenticación) | ¿Quién eres? ¿Puedes entrar al cluster? | `Unauthorized` | AWS: rol/usuario IAM + access entry del cluster |\n| RBAC (autorización) | Ya dentro: ¿qué puedes hacer y dónde? | `Forbidden` | Kubernetes: Role/ClusterRole + RoleBinding |\n\n```bash\naws sts get-caller-identity                      # ¿con qué identidad AWS voy?\nkubectl config current-context                   # ¿contra qué cluster?\nkubectl auth whoami                              # ¿quién soy para Kubernetes? (kubectl reciente)\nkubectl auth can-i delete pods -n <ns>           # ¿puedo hacer esto?\nkubectl auth can-i --list -n <ns>                # todo lo que puedo hacer en ese namespace\n```\n\n## Access entries (EKS): quién entra\n\nCon el modo de autenticación `API`, el acceso se da con access entries, no con el ConfigMap `aws-auth`.\n\n```bash\naws eks list-access-entries --cluster-name <cluster>\naws eks list-associated-access-policies --cluster-name <cluster> --principal-arn <arn-rol>\naws eks list-access-policies                     # AmazonEKSClusterAdminPolicy, AmazonEKSViewPolicy…\n```\n\nUna access entry puede llevar una access policy de EKS (permisos ya hechos) o grupos de Kubernetes que luego se enlazan con RBAC. Detalle en el capítulo 06 del curso.\n\n## RBAC: las piezas\n\n| Objeto | Qué es | Ámbito |\n|---|---|---|\n| Role | Lista de permisos: verbos sobre recursos | Un namespace |\n| ClusterRole | Lista de permisos | Todo el cluster (o reutilizable en namespaces) |\n| RoleBinding | Da un Role o ClusterRole a alguien, en un namespace | Un namespace |\n| ClusterRoleBinding | Da un ClusterRole a alguien en todo el cluster | Todo el cluster |\n| ServiceAccount | Identidad de una aplicación (Pod) dentro de Kubernetes | Un namespace |\n\nVerbos habituales: `get`, `list`, `watch` (leer) · `create`, `update`, `patch`, `delete` (escribir).\n\n```bash\nkubectl create serviceaccount <sa> -n <ns>\nkubectl create role <rol> --verb=get,list,watch --resource=pods -n <ns>\nkubectl create rolebinding <nombre> --role=<rol> --serviceaccount=<ns>:<sa> -n <ns>\nkubectl create rolebinding <nombre> --clusterrole=view --serviceaccount=<ns>:<sa> -n <ns>\nkubectl get roles,rolebindings -n <ns> -o wide\nkubectl describe rolebinding <nombre> -n <ns>\n```\n\nUn RoleBinding que apunta a un ClusterRole da esos permisos solo en el namespace del RoleBinding. Es la forma normal de reutilizar `view` o `edit`.\n\n## ClusterRoles predefinidos\n\n| ClusterRole | Permite | Ojo |\n|---|---|---|\n| `view` | Leer casi todo en el namespace | **No** deja leer Secrets |\n| `edit` | Leer y modificar casi todo | No deja tocar Roles ni RoleBindings |\n| `admin` | Todo en el namespace, incluido dar permisos dentro de él | No toca la cuota ni el propio namespace |\n| `cluster-admin` | Todo, en todo el cluster | Superusuario: casi nunca hace falta |\n\n## Probar permisos de otra identidad\n\n```bash\n# Una ServiceAccount se nombra así: system:serviceaccount:<namespace>:<nombre>\nkubectl auth can-i list pods -n <ns> --as=system:serviceaccount:<ns>:<sa>\nkubectl auth can-i delete deployments -n <ns> --as=system:serviceaccount:<ns>:<sa>\nkubectl auth can-i --list -n <ns> --as=system:serviceaccount:<ns>:<sa>\n```\n\n`--as` necesita que TÚ tengas permiso para suplantar (`impersonate`). Un administrador lo tiene.\n\nMínimo privilegio: da solo los verbos y recursos que la aplicación usa, en su namespace. Si dudas, empieza por `view` y añade.\n\n## Secrets: base64 no es cifrado\n\n```bash\nkubectl get secret <nombre> -n <ns> -o yaml                            # valores en base64\nkubectl get secret <nombre> -n <ns> -o jsonpath='{.data.<clave>}' | base64 -d\nkubectl describe secret <nombre> -n <ns>                               # solo tamaños, sin valores\n```\n\n- base64 es una codificación: cualquiera la deshace. Quien pueda leer Secrets por RBAC ve las contraseñas.\n- En EKS, desde Kubernetes 1.28 los datos de la API se cifran al guardarse en etcd, con KMS (documentación oficial, capítulo 06 del curso). Eso protege el disco, no a quien tiene permiso de lectura.\n- En la práctica te protegen: RBAC estricto (`view` no lee Secrets), no meter Secrets en git y, para lo serio, AWS Secrets Manager.\n\n## Pod Security Admission\n\nSe activa por namespace con una label:\n\n```bash\nkubectl label ns <ns> pod-security.kubernetes.io/enforce=restricted\nkubectl get ns <ns> --show-labels\n```\n\n| Nivel | Qué permite |\n|---|---|\n| `privileged` | Todo (sin restricciones) |\n| `baseline` | Bloquea lo claramente peligroso: privileged, hostNetwork, hostPath… |\n| `restricted` | Lo más estricto: además exige lo de la tabla siguiente |\n\nModos: `enforce` (rechaza), `warn` (avisa al crear) y `audit` (lo anota en el log de auditoría).\n\n### Qué exige `restricted` (documentación oficial de Pod Security Standards)\n\n| Campo | Valor exigido |\n|---|---|\n| `securityContext.runAsNonRoot` (Pod o contenedor) | `true` |\n| `securityContext.allowPrivilegeEscalation` (cada contenedor) | `false` |\n| `securityContext.capabilities.drop` (cada contenedor) | `[\"ALL\"]` (solo se puede volver a añadir `NET_BIND_SERVICE`) |\n| `securityContext.seccompProfile.type` (Pod o contenedor) | `RuntimeDefault` o `Localhost` |\n| Volúmenes | Solo tipos seguros: configMap, secret, emptyDir, persistentVolumeClaim… |\n\nSi no se cumple, el Pod **no se crea**: el error sale en los eventos del ReplicaSet (`violates PodSecurity \"restricted:latest\": …`), y el propio mensaje dice qué falta.\n\n## securityContext: el Pod sin privilegios\n\n```yaml\nspec:\n  securityContext:\n    runAsNonRoot: true\n    seccompProfile:\n      type: RuntimeDefault\n  containers:\n  - name: app\n    image: nginxinc/nginx-unprivileged:1.28-alpine\n    securityContext:\n      allowPrivilegeEscalation: false\n      readOnlyRootFilesystem: true       # opcional; si la app escribe, monta un emptyDir\n      capabilities:\n        drop: [\"ALL\"]\n```\n\n## Imágenes que corren como root\n\n`runAsNonRoot: true` hace que el kubelet compruebe el usuario de la imagen. Si es root, falla con `CreateContainerConfigError: container has runAsNonRoot and image will run as root`.\n\n| Imagen | Usuario | Puerto |\n|---|---|---|\n| `nginx:1.27-alpine` | root | 80 |\n| `nginxinc/nginx-unprivileged:1.28-alpine` | 101 (nginx) | 8080 |\n\nUn proceso que no es root no puede escuchar en puertos por debajo del 1024 sin la capability `NET_BIND_SERVICE`. Por eso las imágenes \"unprivileged\" usan el 8080. Recuerda ajustar el `targetPort` del Service.\n\n## Red\n\nNetworkPolicy (quién puede hablar con quién) y el requisito de la VPC CNI en EKS: CHULETA-RED.\n\n## Checklist rápido\n\n- `aws sts get-caller-identity` antes de nada: ¿cuenta correcta?\n- Cada aplicación con su ServiceAccount y un Role mínimo.\n- Nadie con `cluster-admin` \"por comodidad\".\n- Namespaces de aplicación con Pod Security `baseline` como mínimo, mejor `restricted`.\n- Imágenes no-root, `allowPrivilegeEscalation: false` y `capabilities: drop ALL`.\n- Secrets fuera de git; acceso a Secrets solo a quien lo necesita.\n- \"Denegar todo\" + permisos explícitos en NetworkPolicy (con el soporte de la VPC CNI activado).\n", "CHULETA-YAML.md": "# Chuleta de YAML: plantillas mínimas\n\nTodas se aplican con `kubectl apply -f fichero.yaml`, o sin fichero con `kubectl apply -f - <<'FIN' … FIN`. Sustituye los nombres de ejemplo (`ejemplo`, `pruebas`) por los tuyos.\n\n## Anatomía: los cuatro campos de siempre\n\n```yaml\napiVersion: apps/v1        # grupo/versión de la API (kubectl api-resources lo dice)\nkind: Deployment           # tipo de objeto\nmetadata:                  # nombre, namespace, labels\n  name: ejemplo\n  namespace: pruebas\nspec:                      # lo que QUIERES (estado deseado)\n  …\n# status:                  # lo que HAY: lo escribe Kubernetes, no tú\n```\n\nPara ver qué campos admite algo: `kubectl explain deployment.spec.template.spec.containers`.\n\n## Deployment completo comentado\n\n```yaml\napiVersion: apps/v1\nkind: Deployment\nmetadata:\n  name: ejemplo\n  namespace: pruebas\nspec:\n  replicas: 2\n  selector:\n    matchLabels:\n      app: ejemplo            # DEBE coincidir con template.metadata.labels\n  template:\n    metadata:\n      labels:\n        app: ejemplo\n    spec:\n      nodeSelector:           # solo nodos con esta label\n        disco: ssd\n      tolerations:            # acepta nodos con este taint\n      - key: dedicado\n        operator: Equal\n        value: \"si\"\n        effect: NoSchedule\n      containers:\n      - name: web\n        image: nginx:1.27-alpine\n        ports:\n        - containerPort: 80   # informativo: el puerto real lo decide la aplicación\n          name: http          # opcional: con nombre, un Service puede usar  targetPort: http\n          protocol: TCP\n        resources:\n          requests:           # lo que reserva el scheduler\n            cpu: 100m\n            memory: 64Mi\n          limits:             # el máximo; pasar de memory = OOMKilled\n            memory: 128Mi\n        env:\n        - name: MODO\n          value: \"normal\"\n        - name: MENSAJE\n          valueFrom:\n            configMapKeyRef:\n              name: ejemplo-config\n              key: MENSAJE\n        - name: CLAVE_BD\n          valueFrom:\n            secretKeyRef:\n              name: ejemplo-secreto\n              key: password\n        readinessProbe:       # ¿recibe tráfico?\n          httpGet:\n            path: /\n            port: 80\n          periodSeconds: 5\n        livenessProbe:        # ¿sigue vivo? si falla, se reinicia\n          httpGet:\n            path: /\n            port: 80\n          initialDelaySeconds: 10\n          periodSeconds: 10\n```\n\nPara un contenedor que solo ejecuta un comando (busybox), añade `command: [\"sh\", \"-c\", \"echo hola; sleep 3600\"]`. En un Deployment, el proceso tiene que quedarse corriendo.\n\n## Deployment que pasa Pod Security \"restricted\"\n\n```yaml\n    spec:\n      securityContext:\n        runAsNonRoot: true\n        seccompProfile:\n          type: RuntimeDefault\n      containers:\n      - name: web\n        image: nginxinc/nginx-unprivileged:1.28-alpine   # corre como usuario 101, escucha en 8080\n        ports:\n        - containerPort: 8080\n        securityContext:\n          allowPrivilegeEscalation: false\n          capabilities:\n            drop: [\"ALL\"]\n```\n\nUna imagen que corre como root (nginx normal) no arranca con `runAsNonRoot: true`. Detalle en CHULETA-SEGURIDAD.\n\n## Service: port frente a targetPort\n\n```yaml\napiVersion: v1\nkind: Service\nmetadata:\n  name: ejemplo\n  namespace: pruebas\nspec:\n  type: ClusterIP           # ClusterIP (interno) · NodePort · LoadBalancer\n  selector:\n    app: ejemplo            # a qué Pods manda el tráfico (por labels)\n  ports:\n  - port: 80                # donde escucha el Service\n    targetPort: 80          # donde escucha el CONTENEDOR (8080 en nginx-unprivileged), o el NOMBRE del puerto: http\n    # nodePort: 30080       # solo con type NodePort/LoadBalancer (30000-32767); si no lo pones, se elige uno\n```\n\nLo mismo sin YAML: `kubectl expose deployment <dep> --name=<svc> --port=80 --target-port=http --type=NodePort -n <ns>`.\n\n## ConfigMap\n\n```yaml\napiVersion: v1\nkind: ConfigMap\nmetadata:\n  name: ejemplo-config\n  namespace: pruebas\ndata:\n  MENSAJE: \"Hola\"\n  index.html: |\n    <h1>Página servida desde un ConfigMap<\/h1>\n```\n\n## Secret: stringData frente a data\n\n```yaml\napiVersion: v1\nkind: Secret\nmetadata:\n  name: ejemplo-secreto\n  namespace: pruebas\ntype: Opaque\nstringData:                 # en claro: Kubernetes lo guarda en base64 por ti\n  password: \"MiClave123\"\n# data:                     # alternativa: ya en base64 (echo -n 'MiClave123' | base64)\n#   password: TWlDbGF2ZTEyMw==\n```\n\n## Job: una tarea que termina\n\n```yaml\napiVersion: batch/v1\nkind: Job\nmetadata:\n  name: tarea\n  namespace: pruebas\nspec:\n  backoffLimit: 2           # reintentos si falla\n  template:\n    spec:\n      restartPolicy: Never  # en un Job: Never u OnFailure (nunca Always)\n      containers:\n      - name: tarea\n        image: busybox:1.37\n        command: [\"sh\", \"-c\", \"echo hecho\"]\n```\n\n## CronJob: una tarea programada\n\n```yaml\napiVersion: batch/v1\nkind: CronJob\nmetadata:\n  name: programada\n  namespace: pruebas\nspec:\n  schedule: \"30 2 * * 1\"    # minuto hora día-mes mes día-semana\n  jobTemplate:\n    spec:\n      template:\n        spec:\n          restartPolicy: OnFailure\n          containers:\n          - name: programada\n            image: busybox:1.37\n            command: [\"sh\", \"-c\", \"date\"]\n```\n\n| schedule | Significa |\n|---|---|\n| `*/15 * * * *` | Cada 15 minutos |\n| `0 * * * *` | Al minuto 0 de cada hora |\n| `30 2 * * *` | Todos los días a las 02:30 |\n| `30 2 * * 1` | Los lunes a las 02:30 (0 o 7 = domingo) |\n| `0 9 1 * *` | El día 1 de cada mes a las 09:00 |\n\nSin `timeZone`, la hora es la del controlador. En EKS se supone UTC (no comprobado). Para fijarla: `timeZone: \"Europe/Madrid\"` dentro de `spec`.\n\n## HPA (autoscaling/v2)\n\n```yaml\napiVersion: autoscaling/v2\nkind: HorizontalPodAutoscaler\nmetadata:\n  name: ejemplo\n  namespace: pruebas\nspec:\n  scaleTargetRef:\n    apiVersion: apps/v1\n    kind: Deployment\n    name: ejemplo\n  minReplicas: 1\n  maxReplicas: 5\n  metrics:\n  - type: Resource\n    resource:\n      name: cpu\n      target:\n        type: Utilization\n        averageUtilization: 60   # % sobre requests.cpu (sin requests, no mide)\n```\n\n## ResourceQuota\n\n```yaml\napiVersion: v1\nkind: ResourceQuota\nmetadata:\n  name: limites\n  namespace: pruebas\nspec:\n  hard:\n    pods: \"10\"               # números entre comillas: son cantidades\n    requests.cpu: \"2\"\n    requests.memory: 2Gi\n    limits.memory: 4Gi\n```\n\n## PodDisruptionBudget\n\n```yaml\napiVersion: policy/v1\nkind: PodDisruptionBudget\nmetadata:\n  name: ejemplo-pdb\n  namespace: pruebas\nspec:\n  minAvailable: 1           # o maxUnavailable: 1 (uno de los dos)\n  selector:\n    matchLabels:\n      app: ejemplo\n```\n\n## NetworkPolicy: denegar todo y permitir lo justo\n\n```yaml\napiVersion: networking.k8s.io/v1\nkind: NetworkPolicy\nmetadata:\n  name: denegar-todo\n  namespace: pruebas\nspec:\n  podSelector: {}            # {} = todos los Pods del namespace\n  policyTypes: [\"Ingress\"]   # sin reglas ingress = no entra nada\n---\napiVersion: networking.k8s.io/v1\nkind: NetworkPolicy\nmetadata:\n  name: permitir-front-a-api\n  namespace: pruebas\nspec:\n  podSelector:\n    matchLabels:\n      app: api               # a QUIÉN protege\n  policyTypes: [\"Ingress\"]\n  ingress:\n  - from:\n    - podSelector:\n        matchLabels:\n          app: front         # DESDE quién se permite\n    ports:\n    - port: 80\n---\napiVersion: networking.k8s.io/v1\nkind: NetworkPolicy\nmetadata:\n  name: permitir-desde-otro-namespace\n  namespace: pruebas\nspec:\n  podSelector: {}            # protege a todos los Pods de «pruebas»\n  policyTypes: [\"Ingress\"]\n  ingress:\n  - from:\n    - namespaceSelector:     # DESDE los Pods de otro namespace…\n        matchLabels:\n          kubernetes.io/metadata.name: otro-ns   # etiqueta que Kubernetes pone sola a cada namespace\n    ports:                   # …y SOLO a este puerto\n    - protocol: TCP\n      port: 9000\n```\n\n`from` y `ports` en la misma regla = «desde ahí Y a ese puerto». Si pones `namespaceSelector: {}` abres a TODOS los namespaces. Las etiquetas de un namespace: `kubectl get ns --show-labels`.\n\nLas políticas se suman: lo que permita cualquiera de ellas, pasa. En EKS solo se aplican si la VPC CNI tiene `enableNetworkPolicy` (CHULETA-RED).\n\n## ServiceAccount, Role y RoleBinding\n\n```yaml\napiVersion: v1\nkind: ServiceAccount\nmetadata:\n  name: robot\n  namespace: pruebas\n---\napiVersion: rbac.authorization.k8s.io/v1\nkind: Role\nmetadata:\n  name: leer-pods\n  namespace: pruebas\nrules:\n- apiGroups: [\"\"]            # \"\" = grupo core (pods, services, configmaps…)\n  resources: [\"pods\"]\n  verbs: [\"get\", \"list\", \"watch\"]\n---\napiVersion: rbac.authorization.k8s.io/v1\nkind: RoleBinding\nmetadata:\n  name: robot-leer-pods\n  namespace: pruebas\nsubjects:\n- kind: ServiceAccount\n  name: robot\n  namespace: pruebas\nroleRef:\n  apiGroup: rbac.authorization.k8s.io\n  kind: Role                 # o ClusterRole (view, edit, admin…)\n  name: leer-pods\n```\n\nDeployments y ReplicaSets están en el grupo `apps`; Jobs y CronJobs, en `batch`.\n\n## Namespace con Pod Security\n\n```yaml\napiVersion: v1\nkind: Namespace\nmetadata:\n  name: pruebas\n  labels:\n    pod-security.kubernetes.io/enforce: restricted   # privileged · baseline · restricted\n```\n\n## Errores típicos de YAML\n\n| Error | Síntoma | Arreglo |\n|---|---|---|\n| Tabuladores | `found character that cannot start any token` | Solo espacios (2 por nivel) |\n| Indentación descuadrada | Campos que \"desaparecen\" o `unknown field` | Alinea los hijos bajo su padre |\n| Falta `-` en una lista | `cannot unmarshal object into … array` | `containers:` y `env:` son listas: cada elemento empieza por `- ` |\n| Número sin comillas donde va texto | `cannot unmarshal number into … string` | Valores de `env`, `data` y labels entre comillas: `\"8080\"`, `\"true\"` |\n| `yes`, `no`, `on`, `off` sin comillas | Se interpretan como booleanos | Entre comillas: `\"si\"`, `\"no\"` |\n| selector distinto de las labels del template | `selector does not match template labels` | `matchLabels` igual que `template.metadata.labels` |\n| Cambiar el selector de un Deployment existente | `field is immutable` | Borrar y crear de nuevo |\n| `kind` o `apiVersion` mal escrito | `no matches for kind` | `kubectl api-resources` da los correctos |\n\nTruco para no empezar de cero: `kubectl create deployment x --image=nginx --dry-run=client -o yaml > x.yaml`.\n"};
/* ============================================================================
   yaml.js — lector y escritor de YAML (el subconjunto que usa Kubernetes)
   Soporta: mapas y listas en bloque, "- clave: valor", escalares con y sin
   comillas, números/booleanos/null, listas y mapas en línea ([a, b] {a: b}),
   bloques literales | y |-, comentarios. Errores con número de línea.
   ========================================================================== */
"use strict";

function quitarComentario(s){
  let q=null;
  for (let i=0;i<s.length;i++){
    const c=s[i];
    if (q){ if (c===q && s[i-1]!=="\\") q=null; continue; }
    if (c==='"'||c==="'"){ q=c; continue; }
    if (c==="#" && (i===0 || /\s/.test(s[i-1]))) return s.slice(0,i).replace(/\s+$/,"");
  }
  return s.replace(/\s+$/,"");
}

function partirEnLinea(s, sep){           // parte "a, [b, c], 'd,e'" respetando comillas y anidamiento
  const r=[]; let prof=0, q=null, act="";
  for (const c of s){
    if (q){ act+=c; if (c===q) q=null; continue; }
    if (c==='"'||c==="'"){ q=c; act+=c; continue; }
    if (c==="["||c==="{") prof++;
    if (c==="]"||c==="}") prof--;
    if (c===sep && prof===0){ r.push(act.trim()); act=""; continue; }
    act+=c;
  }
  if (act.trim()!=="") r.push(act.trim());
  return r;
}

function yEscalar(v){
  v=v.trim();
  if (v==="") return null;
  if (v.startsWith('"')){
    if (!v.endsWith('"') || v.length<2) throw new Error(`comillas sin cerrar: ${v}`);
    return v.slice(1,-1).replace(/\\n/g,"\n").replace(/\\t/g,"\t").replace(/\\"/g,'"').replace(/\\\\/g,"\\");
  }
  if (v.startsWith("'")){
    if (!v.endsWith("'") || v.length<2) throw new Error(`comillas sin cerrar: ${v}`);
    return v.slice(1,-1).replace(/''/g,"'");
  }
  if (v.startsWith("[")){
    if (!v.endsWith("]")) throw new Error(`corchete sin cerrar: ${v}`);
    const dentro=v.slice(1,-1).trim(); return dentro===""?[]:partirEnLinea(dentro,",").map(yEscalar);
  }
  if (v.startsWith("{")){
    if (!v.endsWith("}")) throw new Error(`llave sin cerrar: ${v}`);
    const o={}; const dentro=v.slice(1,-1).trim(); if (dentro==="") return o;
    for (const par of partirEnLinea(dentro,",")){
      const m=par.match(/^("[^"]*"|'[^']*'|[^:]+?)\s*:\s*(.*)$/); if (!m) throw new Error(`par «clave: valor» inválido: ${par}`);
      o[yEscalar(m[1])] = yEscalar(m[2]);
    }
    return o;
  }
  if (/^(true|True|TRUE)$/.test(v)) return true;
  if (/^(false|False|FALSE)$/.test(v)) return false;
  if (/^(null|Null|NULL|~)$/.test(v)) return null;
  if (/^-?\d+$/.test(v)) return parseInt(v,10);
  if (/^-?\d+\.\d+$/.test(v)) return parseFloat(v);
  return v;
}

function yamlParse(texto){
  const crudas=texto.replace(/\r/g,"").split("\n");
  const L=[];
  crudas.forEach((raw,idx)=>{
    if (!raw.trim() || /^\s*#/.test(raw)) { L.push({vacia:true,raw,n:idx+1}); return; }
    const sangria=raw.match(/^[ \t]*/)[0];
    if (sangria.includes("\t")) throw new Error(`línea ${idx+1}: YAML no admite tabuladores para sangrar (usa espacios)`);
    L.push({ind:sangria.length, txt:quitarComentario(raw.trim()), raw, n:idx+1});
  });
  const util=L.filter(l=>!l.vacia);
  let i=0;
  const esItem = t => t==="-" || t.startsWith("- ");
  const esClave = t => /^("[^"]*"|'[^']*'|[^\s"'\[{][^:]*?):(\s|$)/.test(t);

  function bloqueLiteral(idxRaw, indPadre, modo){
    const lineas=[]; let k=idxRaw+1;
    while (k<L.length){ const l=L[k]; if (!l.vacia && l.ind<=indPadre) break; lineas.push(l.raw); k++; }
    while (lineas.length && !lineas[lineas.length-1].trim()) lineas.pop();
    const min=Math.min(...lineas.filter(x=>x.trim()).map(x=>x.match(/^ */)[0].length));
    const txt=lineas.map(x=>x.slice(isFinite(min)?min:0)).join("\n");
    // saltar en `util` las líneas consumidas
    while (i<util.length && util[i].n<= (L[k-1]?L[k-1].n:0)) i++;
    return modo==="|-" ? txt : txt+"\n";
  }

  function nodo(ind){
    if (i>=util.length) return null;
    return esItem(util[i].txt) ? lista(util[i].ind) : mapa(util[i].ind);
  }
  function lista(ind){
    const arr=[];
    while (i<util.length && util[i].ind===ind && esItem(util[i].txt)){
      const l=util[i]; const resto=l.txt==="-"?"":l.txt.slice(1).trim();
      if (!resto){ i++; arr.push(i<util.length && util[i].ind>ind ? nodo(util[i].ind) : null); continue; }
      if (esClave(resto)){
        const despl = l.txt.length - l.txt.slice(1).trimStart().length;   // posición del contenido tras "- "
        util[i]={ind:ind+despl, txt:resto, raw:l.raw, n:l.n};
        arr.push(mapa(ind+despl)); continue;
      }
      i++; arr.push(yEscalar(resto));
    }
    return arr;
  }
  function mapa(ind){
    const obj={};
    while (i<util.length && util[i].ind===ind && !esItem(util[i].txt)){
      const l=util[i];
      const m=l.txt.match(/^("[^"]*"|'[^']*'|[^:]+?):(?:\s+(.*))?$/);
      if (!m) throw new Error(`línea ${l.n}: se esperaba «clave: valor» y hay «${l.txt}»`);
      const clave=String(yEscalar(m[1].trim())); const val=m[2];
      if (clave in obj) throw new Error(`línea ${l.n}: la clave «${clave}» está repetida`);
      i++;
      if (val===undefined || val===""){
        if (i<util.length && (util[i].ind>ind || (util[i].ind===ind && esItem(util[i].txt)))) obj[clave]=nodo(util[i].ind);
        else obj[clave]=null;
      } else if (val==="|" || val==="|-" || val===">" || val===">-"){
        const idxRaw=L.findIndex(x=>x.n===l.n);
        obj[clave]=bloqueLiteral(idxRaw, ind, val);
      } else obj[clave]=yEscalar(val);
    }
    if (i<util.length && util[i].ind>ind) throw new Error(`línea ${util[i].n}: sangría inesperada (¿espacios de más?)`);
    return obj;
  }
  const r = nodo(util.length?util[0].ind:0);
  if (i<util.length) throw new Error(`línea ${util[i].n}: sangría incoherente («${util[i].txt}»)`);
  return r;
}

/* documentos separados por --- */
function yamlParseTodos(texto){
  return texto.split(/^---\s*$/m).map(t=>t.trim()).filter(t=>t && t.split("\n").some(l=>l.trim() && !l.trim().startsWith("#"))).map(yamlParse);
}

function yStr(v){
  if (v===null || v===undefined) return "null";
  if (typeof v==="number" || typeof v==="boolean") return String(v);
  const s=String(v);
  if (s==="") return '""';
  if (/^(true|false|null|~|yes|no|on|off)$/i.test(s) || /^-?\d+(\.\d+)?$/.test(s) || /^[\s\-?:,\[\]{}#&*!|>'"%@`]/.test(s) || /: |\s#|^\s|\s$/.test(s) || s.includes('"'))
    return '"'+s.replace(/\\/g,"\\\\").replace(/"/g,'\\"').replace(/\n/g,"\\n")+'"';
  return s;
}
function yamlDump(v, ind=0){
  const pad=" ".repeat(ind);
  if (Array.isArray(v)){
    if (!v.length) return "[]";
    return v.map(x=>{
      if (x && typeof x==="object" && !Array.isArray(x)){
        const claves=Object.keys(x); if (!claves.length) return pad+"- {}";
        const cuerpo=yamlDump(x, ind+2).split("\n");
        cuerpo[0]=pad+"- "+cuerpo[0].slice(ind+2);
        return cuerpo.join("\n");
      }
      if (Array.isArray(x)) return pad+"- "+(x.length?"\n"+yamlDump(x,ind+2):"[]");
      return pad+"- "+yStr(x);
    }).join("\n");
  }
  if (v && typeof v==="object"){
    const claves=Object.keys(v); if (!claves.length) return "{}";
    return claves.map(k=>{
      const x=v[k]; const kk=/^[\w.\/-]+$/.test(k)?k:yStr(k);
      if (x && typeof x==="object"){
        if (Array.isArray(x)) return x.length? `${pad}${kk}:\n${yamlDump(x,ind)}` : `${pad}${kk}: []`;
        return Object.keys(x).length? `${pad}${kk}:\n${yamlDump(x,ind+2)}` : `${pad}${kk}: {}`;
      }
      if (typeof x==="string" && x.includes("\n")) return `${pad}${kk}: |\n`+x.replace(/\n$/,"").split("\n").map(l=>pad+"  "+l).join("\n");
      return `${pad}${kk}: ${yStr(x)}`;
    }).join("\n");
  }
  return pad+yStr(v);
}

/* ---------------- JSONPath (lo que usa kubectl -o jsonpath) ---------------- */
function jpSegmentos(expr){
  const s=[]; let i=0; expr=expr.trim();
  if (expr.startsWith("$")) i=1;
  while (i<expr.length){
    if (expr[i]==="."){ i++; if (expr[i]==="."){ i++; } let m=expr.slice(i).match(/^(?:\\\.|[\w\-\/])+/); if (m){ s.push({t:"k",v:m[0].replace(/\\\./g,".")}); i+=m[0].length; } continue; }
    if (expr[i]==="["){
      const fin=expr.indexOf("]",i); const dentro=expr.slice(i+1,fin).trim(); i=fin+1;
      if (dentro==="*") s.push({t:"*"});
      else if (/^-?\d+$/.test(dentro)) s.push({t:"i",v:parseInt(dentro,10)});
      else if (/^['"].*['"]$/.test(dentro)) s.push({t:"k",v:dentro.slice(1,-1)});
      else if (dentro.startsWith("?(")){
        const m=dentro.match(/^\?\(@\.([\w.\-\/]+)\s*(==|!=)\s*['"]?([^'")]*)['"]?\)$/);
        if (m) s.push({t:"f",ruta:m[1].split("."),op:m[2],v:m[3]});
      }
      continue;
    }
    if (expr[i]==="@"){ i++; continue; }
    const m=expr.slice(i).match(/^[\w\-\/]+/); if (m){ s.push({t:"k",v:m[0]}); i+=m[0].length; } else i++;
  }
  return s;
}
function jpEval(obj, expr){
  let act=[obj];
  for (const seg of jpSegmentos(expr)){
    const sig=[];
    for (const o of act){
      if (o===undefined || o===null) continue;
      if (seg.t==="k"){ if (typeof o==="object" && seg.v in o) sig.push(o[seg.v]); }
      else if (seg.t==="i"){ if (Array.isArray(o)){ const x=o[seg.v<0?o.length+seg.v:seg.v]; if (x!==undefined) sig.push(x); } }
      else if (seg.t==="*"){ if (Array.isArray(o)) sig.push(...o); else if (typeof o==="object") sig.push(...Object.values(o)); }
      else if (seg.t==="f"){ if (Array.isArray(o)) for (const x of o){ let v=x; for (const r of seg.ruta) v=v&&v[r]; const ok = String(v)===seg.v; if (seg.op==="=="?ok:!ok) sig.push(x); } }
    }
    act=sig;
  }
  return act;
}
function jpFormatear(v){ return (v!==null && typeof v==="object") ? JSON.stringify(v) : String(v); }
function jsonpath(obj, plantilla){
  plantilla=plantilla.replace(/^['"]|['"]$/g,"");
  if (!plantilla.includes("{")) plantilla="{"+plantilla+"}";
  const trozos=[]; const re=/\{([^}]*)\}/g; let m, ult=0;
  while ((m=re.exec(plantilla))){ if (m.index>ult) trozos.push({lit:plantilla.slice(ult,m.index)}); trozos.push({exp:m[1].trim()}); ult=re.lastIndex; }
  if (ult<plantilla.length) trozos.push({lit:plantilla.slice(ult)});
  function correr(lista, ctx){
    let salida=""; let k=0;
    while (k<lista.length){
      const t=lista[k];
      if (t.lit!==undefined){ salida+=t.lit; k++; continue; }
      if (t.exp.startsWith("range ")){
        let prof=1, j=k+1; for (; j<lista.length; j++){ const e=lista[j].exp; if (e&&e.startsWith("range ")) prof++; if (e==="end" && --prof===0) break; }
        const cuerpo=lista.slice(k+1,j); for (const x of jpEval(ctx, t.exp.slice(6))) salida+=correr(cuerpo, x);
        k=j+1; continue;
      }
      if (t.exp==="end"){ k++; continue; }
      if (/^".*"$/.test(t.exp)){ salida+=t.exp.slice(1,-1).replace(/\\n/g,"\n").replace(/\\t/g,"\t"); k++; continue; }
      salida+=jpEval(ctx, t.exp).map(jpFormatear).join(" "); k++;
    }
    return salida;
  }
  return correr(trozos, obj);
}

/* ---------------- JMESPath mínimo (aws --query) ---------------- */
function jmes(obj, expr){
  expr=expr.trim().replace(/^['"]|['"]$/g,"");
  const toks=[]; let i=0;
  while (i<expr.length){
    const c=expr[i];
    if (c==="."){ i++; continue; }
    if (c==="["){
      const fin=expr.indexOf("]",i); const d=expr.slice(i+1,fin).trim(); i=fin+1;
      if (d===""||d==="*") toks.push({t:"proy"}); else if (/^-?\d+$/.test(d)) toks.push({t:"idx",v:+d});
      else if (d.startsWith("?")) { const m=d.match(/^\?\s*([\w.]+)\s*==\s*[`'"]([^`'"]*)[`'"]$/); if (m) toks.push({t:"filtro",ruta:m[1],v:m[2]}); }
      else toks.push({t:"multi",v:partirEnLinea(d,",")});
      continue;
    }
    const m=expr.slice(i).match(/^[\w\-]+/); if (m){ toks.push({t:"k",v:m[0]}); i+=m[0].length; } else i++;
  }
  function aplicar(v, ts){
    for (let k=0;k<ts.length;k++){
      const t=ts[k]; if (v===undefined||v===null) return null;
      if (t.t==="k") v=v[t.v];
      else if (t.t==="idx") v=Array.isArray(v)?v[t.v<0?v.length+t.v:t.v]:null;
      else if (t.t==="multi") v=t.v.map(e=>jmes(v,e));
      else if (t.t==="filtro" || t.t==="proy"){
        if (!Array.isArray(v)) return null;
        let arr=v; if (t.t==="filtro") arr=arr.filter(x=>String(jmes(x,t.ruta))===t.v);
        const resto=ts.slice(k+1); const r=[];
        for (const x of arr){ const y=aplicar(x,resto); if (y===null||y===undefined) continue; if (Array.isArray(y) && resto.some(z=>z.t==="proy")) r.push(...y); else r.push(y); }
        return r;
      }
    }
    return v===undefined?null:v;
  }
  return aplicar(obj,toks);
}

function hash(s){ let h = 2166136261; s = String(s); for (let i = 0; i < s.length; i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
const ALF = "bcdfghjklmnpqrstvwxz2456789";
let CONT_ALEA = 0;
function sufijo(n = 5, semilla){
  let h = hash((semilla !== undefined ? semilla : "") + "|" + (CONT_ALEA++) + "|" + Math.random());
  let s = ""; for (let i = 0; i < n; i++){ s += ALF[h % ALF.length]; h = hash(s + h); } return s;
}
function hashPlantilla(tpl){ let h = hash(JSON.stringify(tpl)); let s = ""; for (let i = 0; i < 10; i++){ s += ALF[h % ALF.length]; h = hash(s + h); } return s; }
const copia = o => o === undefined ? undefined : JSON.parse(JSON.stringify(o));
function uid(){ const h = n => hash(n + Math.random()).toString(16).padStart(8, "0"); return `${h(1)}-${h(2).slice(0,4)}-${h(3).slice(0,4)}-${h(4).slice(0,4)}-${h(5)}${h(6).slice(0,4)}`; }
function b64e(s){ try { return btoa(unescape(encodeURIComponent(s))); } catch(e){ return btoa(s); } }
function b64d(s){ try { return decodeURIComponent(escape(atob(String(s).trim()))); } catch(e){ return null; } }

function cpuM(q){                       // "100m" → 100 ; "1" → 1000 ; 0.5 → 500
  if (q === undefined || q === null || q === "") return 0;
  const s = String(q).trim(); if (/m$/.test(s)) return parseFloat(s);
  const v = parseFloat(s); return isNaN(v) ? NaN : Math.round(v * 1000);
}
function memMi(q){                      // → MiB
  if (q === undefined || q === null || q === "") return 0;
  const s = String(q).trim(); const v = parseFloat(s); if (isNaN(v)) return NaN;
  if (/Gi$/.test(s)) return v * 1024; if (/Mi$/.test(s)) return v; if (/Ki$/.test(s)) return v / 1024;
  if (/G$/.test(s)) return v * 1e9 / 1048576; if (/M$/.test(s)) return v * 1e6 / 1048576; if (/k$/.test(s)) return v * 1e3 / 1048576;
  return v / 1048576;
}
function edad(t){
  const s = Math.max(0, Math.floor(ahora() - t));
  if (s < 120) return s + "s"; if (s < 3600) return Math.floor(s / 60) + "m" + (s < 600 && s % 60 ? (s % 60) + "s" : "");
  return Math.floor(s / 3600) + "h";
}

const REGISTRO = {
  "nginx": /^(1\.2[0-9](\.\d+)?(-alpine(-slim)?|-perl|-bookworm)?|latest|alpine|stable(-alpine)?|mainline(-alpine)?)$/,
  "nginxinc/nginx-unprivileged": /^(1\.2[0-9](\.\d+)?(-alpine)?|latest|alpine|stable(-alpine)?|mainline(-alpine)?)$/,
  "busybox": /^(1\.3[0-7](\.\d+)?(-(musl|glibc|uclibc))?|latest|stable|musl|glibc|uclibc)$/,
  "polinux/stress": /^(latest|1\.0\.4)$/,
  "httpd": /^(2\.4(\.\d+)?(-alpine)?|latest|alpine)$/,
  "redis": /^(7(\.\d+){0,2}(-alpine)?|latest|alpine)$/,
  "alpine": /^(3(\.\d+){0,2}|latest)$/,
  "python": /^(3(\.\d+){0,2}(-alpine|-slim)?|latest|alpine|slim)$/,
  "postgres": /^(1[4-7](\.\d+)?(-alpine)?|latest|alpine)$/,

function imagenInfo(img){
  const s = String(img || "").trim(); if (!s) return {ok:false, motivo:"vacia", repo:"", tag:""};
  let repo = s, tag = "latest";
  const k = s.lastIndexOf(":"); if (k > s.lastIndexOf("/")){ repo = s.slice(0, k); tag = s.slice(k + 1); }
  repo = repo.replace(/^docker\.io\//, "").replace(/^library\//, "");
  if (repo.includes("/eks/") || /^\d{12}\.dkr\.ecr\.[a-z0-9-]+\.amazonaws\.com\//.test(repo)) return {ok:true, repo, tag, sistema:true};
  const re = REGISTRO[repo];
  if (!re) return {ok:false, motivo:"repo", repo, tag};
  if (!re.test(tag)) return {ok:false, motivo:"tag", repo, tag};
  return {ok:true, repo, tag};
}
function referenciaCompleta(i){ return (i.repo.includes("/") && i.repo.split("/")[0].includes(".") ? "" : "docker.io/" + (i.repo.includes("/") ? "" : "library/")) + i.repo + ":" + i.tag; }
function perfil(c){
  const i = imagenInfo(c.image);
  if (i.sistema) return {tipo:"sistema", root:true};
  if (i.repo === "nginx" || i.repo === "httpd") return {tipo:"web", puerto:80, root:true, curl:true};
  if (i.repo === "nginxinc/nginx-unprivileged") return {tipo:"web", puerto:8080, root:false, curl:true};
  if (i.repo === "polinux/stress") return {tipo:"stress", root:true};
  if (["busybox","alpine"].includes(i.repo)) return {tipo:"shell", root:true};
  return {tipo:"generico", root:true};
}

function crearNamespace(n, labels){
  if (!S.ns[n]) S.ns[n] = {labels:Object.assign({"kubernetes.io/metadata.name":n}, labels || {}), creado:ahora(), uid:uid()};
  if (!obj("ServiceAccount", n, "default")) guardarObj({apiVersion:"v1", kind:"ServiceAccount", metadata:metaNueva("default", n)});
}
function borrarNamespace(n){
  delete S.ns[n];
  S.objs = S.objs.filter(o => o.metadata.namespace !== n);
  S.pods = S.pods.filter(p => p.ns !== n);
  S.rs = S.rs.filter(r => r.ns !== n);
  S.eventos = S.eventos.filter(e => e.ns !== n);
  for (const k of Object.keys(S.pf)) if (S.pf[k].ns === n) delete S.pf[k];
}

function objs(kind, ns){ return S.objs.filter(o => o.kind === kind && (ns === null || ns === undefined || o.metadata.namespace === ns)); }
function guardarObj(o){
  o.metadata = o.metadata || {}; o.metadata.labels = o.metadata.labels || {}; o.metadata.annotations = o.metadata.annotations || {};
  if (!o.metadata.uid) o.metadata.uid = uid();

  const ctx = {env:Object.assign({}, env), lineas:[], ns, pod, perfil:perf, hostname:pod ? pod.name : "pod", cmdPrincipal:cmd.join(" "), bucle:null,
               c:contenedor || (pod && pod.spec ? pod.spec.containers[0] : null), objetivo:pod && pod.spec && !pod.efimero && (!contenedor || esExec) ? pod : null};
  ctx.out = t => { for (const l of String(t).split("\n")) ctx.lineas.push(l); };
  const prog = (cmd[0] || "").replace(/^\/bin\//, "").replace(/^\/usr\/bin\//, "");
  const hayShell = perf.tipo === "shell" || perf.tipo === "web" || perf.tipo === "stress";
  if (!hayShell || (!APPLETS.includes(prog) && prog !== "curl")){
    if (perf.tipo === "generico" && prog) return {fin:"corriendo", codigo:0, lineas:[]};
    return {fin:"starterror", codigo:128, lineas:[], errorArranque:`failed to create containerd task: failed to create shim task: OCI runtime create failed: runc create failed: unable to start container process: error during container init: exec: "${cmd[0]}": executable file not found in $PATH: unknown`};
  }
  if (prog === "curl" && !perf.curl) return {fin:"starterror", codigo:128, lineas:[], errorArranque:`exec: "curl": executable file not found in $PATH: unknown`};
  try {
    let codigo;
    if ((prog === "sh" || prog === "ash") && cmd[1] === "-c") codigo = ejecutarNodos(analizarScript(cmd.slice(2).join(" ")), ctx);
    else if (prog === "sh" || prog === "ash") codigo = 0;
    else codigo = comandoSimple(cmd.map(x => /\s/.test(x) ? `"${x}"` : x).join(" "), ctx);
    return {fin:"sale", codigo, lineas:ctx.lineas};
  } catch(e){
    if (e instanceof Bloqueo){ registrarEscrituras(pod, ctx.bucle); return {fin:"corriendo", codigo:0, lineas:ctx.lineas, bucle:ctx.bucle}; }
    if (e instanceof Salida) return {fin:"sale", codigo:e.codigo, lineas:ctx.lineas};
    return {fin:"sale", codigo:2, lineas:ctx.lineas.concat([`sh: syntax error: ${e.message}`])};
  }
}
function logsNginx(){
  return ["/docker-entrypoint.sh: /docker-entrypoint.d/ is not empty, will attempt to perform configuration",
          "/docker-entrypoint.sh: Launching /docker-entrypoint.d/10-listen-on-ipv6-by-default.sh",
          "/docker-entrypoint.sh: Configuration complete; ready for start up",
          `${new Date().toISOString().slice(0,19).replace("T"," ").replace(/-/g,"/")} [notice] 1#1: nginx/1.27.5`,
          `${new Date().toISOString().slice(0,19).replace("T"," ").replace(/-/g,"/")} [notice] 1#1: start worker processes`];
}
function arrancarContenedor(p, c, env){
  c = c || p.spec.containers[0]; const perf = perfil(c); const principal = c === p.spec.containers[0];
  const cmd = [...(c.command || []), ...(c.args || [])];
  if (perf.tipo === "sistema") return {fin:"corriendo", lineas:[], escucha:null};
  if (perf.tipo === "web" && !(c.command && c.command.length) && !(c.args && c.args.length)) return {fin:"corriendo", lineas:logsNginx(), escucha:perf.puerto};
  if (perf.tipo === "stress"){
    const arg = (c.args || c.command || []).join(" "); const m = arg.match(/--vm-bytes\s+(\d+)([MmGgKk]?)/);
    let mb = m ? parseFloat(m[1]) * (/[Gg]/.test(m[2]) ? 1024 : /[Kk]/.test(m[2]) ? 1/1024 : 1) : 256;
    return {fin:"corriendo", lineas:["stress: info: [1] dispatching hogs: 0 cpu, 0 io, 1 vm, 0 hdd"], mem:mb * 1e6 / 1048576 + 1.5};
  }
  if (!cmd.length){
    if (perf.tipo === "generico") return {fin:"corriendo", lineas:[]};
    return {fin:"sale", codigo:0, lineas:[]};
  }
  const r = ejecutarProceso(cmd, env || p.envSnap || {}, p, p.ns, perf, principal ? undefined : c);
  if (perf.tipo === "web" && r.fin === "corriendo" && cmd.join(" ").includes("nginx")) r.escucha = perf.puerto;
  return r;
}

/* ---------- red: DNS, Services, NetworkPolicy ---------- */
function corednsListos(){ return S.pods.filter(p => p.ns === "kube-system" && p.labels["k8s-app"] === "coredns" && p.listo).length; }

  if (/\.(com|es|org|net|io|dev|aws)$/.test(nombre) && !nombre.includes(".svc")) return {ip:`142.250.${hash(nombre) % 200}.${hash(nombre + 1) % 200}`, fqdn:nombre, externo:true};

  if (partes.length === 1){ svcN = partes[0]; nsN = nsOrigen; } else if (partes.length === 2){ [svcN, nsN] = partes; } else return {error:"nx"};
  const s = obj("Service", nsN, svcN); if (!s) return {error:"nx"};

}
function selecciona(sel, labels){
  if (!sel) return true;

  for (const [k, v] of Object.entries(ml || {})) if (labels[k] !== String(v)) return false;
  for (const e of sel.matchExpressions || []){
    const v = labels[e.key];
    if (e.operator === "In" && !(e.values || []).includes(v)) return false;
    if (e.operator === "NotIn" && (e.values || []).includes(v)) return false;
    if (e.operator === "Exists" && v === undefined) return false;
    if (e.operator === "DoesNotExist" && v !== undefined) return false;

}
function endpointsDe(s){
  if (!s.spec.selector || !Object.keys(s.spec.selector).length) return [];
  return S.pods.filter(p => p.ns === s.metadata.namespace && p.listo && !p.borrando && p.ip && selecciona(s.spec.selector, p.labels));
}
function puertoContenedor(p, tp){
  if (tp === undefined || tp === null) return null;
  if (/^\d+$/.test(String(tp))) return parseInt(tp, 10);
  for (const c of p.spec.containers || []) for (const port of c.ports || []) if (port.name === tp) return port.containerPort;
  return null;
}
function permiteRed(origen, destino){

  });

  for (const np of pols) for (const regla of np.spec.ingress || []){
    const desde = regla.from;
    if (!desde || !desde.length) return true;
    for (const f of desde){
      if (!origen) continue;
      if (f.namespaceSelector){
        const nsLab = (S.ns[origen.ns] || {labels:{}}).labels;
        if (selecciona(f.namespaceSelector, nsLab) && (!f.podSelector || selecciona(f.podSelector, origen.labels))) return true;
      } else if (f.podSelector){

function analizarURL(url){

}
/* petición HTTP desde un Pod (o desde el "exterior" si origen es null) */
function peticionHTTP(origen, nsOrigen, url, opciones){
  opciones = opciones || {};

  if (/\.elb\.amazonaws\.com$/.test(u.host)){
    const s = S.objs.find(o => o.kind === "Service" && o.status && o.status.loadBalancer && (o.status.loadBalancer.ingress || []).some(i => i.hostname === u.host));
    if (!s) return malo(`wget: bad address '${u.host}'`, `curl: (6) Could not resolve host: ${u.host}`, 6);

  if (!r.svc) return malo(`wget: can't connect to remote host (${r.ip}): Connection refused`, `curl: (7) Failed to connect to ${u.host} port ${u.puerto}: Connection refused`, 7);

}
function entregarAPod(origen, destino, u, mismoPod){

  if ((!mismoPod && destino.estado !== "Running") || !escuchaPod(destino).includes(u.puerto)) return {ok:false, wget:`wget: can't connect to remote host (${mismoPod ? "127.0.0.1" : destino.ip}): Connection refused`, curl:`curl: (7) Failed to connect to ${host} port ${u.puerto} after 0 ms: Couldn't connect to server`, codigoCurl:7};

function entregar(origen, s, sp, u, desdeFuera){
  const eps = endpointsDe(s);

  if (!eps.length) return {ok:false, wget:`wget: can't connect to remote host (${ip}): Connection refused`, curl:`curl: (7) Failed to connect to ${u.host} port ${u.puerto} after 1 ms: Couldn't connect to server`, codigoCurl:7};
  const destino = eps[0];
  if (!desdeFuera && !permiteRed(origen, destino)) return {ok:false, wget:"wget: download timed out", curl:`curl: (28) Failed to connect to ${u.host} port ${u.puerto} after 3001 ms: Timeout was reached`, codigoCurl:28};
  const tp = puertoContenedor(destino, sp.targetPort);
  if (!escuchaPod(destino).includes(tp)) return {ok:false, wget:`wget: can't connect to remote host (${ip}): Connection refused`, curl:`curl: (7) Failed to connect to ${u.host} port ${u.puerto} after 0 ms: Couldn't connect to server`, codigoCurl:7};
  const r = contenidoWeb(destino, u.ruta);
  if (r.codigo !== 200) return {ok:false, wget:`wget: server returned error: HTTP/1.1 ${r.codigo} Not Found`, curl:r.cuerpo, codigoCurl:0, cuerpo:r.cuerpo};

/* ---------- sondas ---------- */
function probarSonda(p, sonda, cont){
  const c = cont || p.spec.containers[0];
  if (sonda.httpGet){
    const puerto = puertoContenedor(p, sonda.httpGet.port); const ruta = sonda.httpGet.path || "/";
    if (!escuchaPod(p).includes(puerto)) return {ok:false, msg:`Get "http://${p.ip}:${sonda.httpGet.port}${ruta}": dial tcp ${p.ip}:${sonda.httpGet.port}: connect: connection refused`};
    const r = contenidoWeb(p, ruta); if (r.codigo >= 200 && r.codigo < 400) return {ok:true};
    return {ok:false, msg:`HTTP probe failed with statuscode: ${r.codigo}`};
  }
  if (sonda.tcpSocket){
    const puerto = puertoContenedor(p, sonda.tcpSocket.port);
    return escuchaPod(p).includes(puerto) ? {ok:true} : {ok:false, msg:`dial tcp ${p.ip}:${sonda.tcpSocket.port}: connect: connection refused`};
  }
  if (sonda.exec){
    const r = ejecutarProceso(sonda.exec.command || [], c === p.spec.containers[0] ? (p.envSnap || {}) : envPlano(c), p, p.ns, perfil(c), c === p.spec.containers[0] ? undefined : c);
    if (r.fin === "starterror") return {ok:false, msg:r.errorArranque};
    return r.codigo === 0 ? {ok:true} : {ok:false, msg:r.lineas.join("\n") || `command ${JSON.stringify(sonda.exec.command)} exited with ${r.codigo}`};
  }
  return {ok:true};
}

/* ---------- evaluación de un Pod ---------- */
const CICLO_CRASH = 12;
function evaluarPod(p){
  if (p.borrando) return;

  if (!p.node || !n){ p.estado = "Pending"; p.fase = "Pending"; p.listo = false; return; }
  if (!n.ready){ return; }                                   // nodo caído: se queda con el último estado conocido

  p.errorMontaje = null;

  const inits = p.spec.initContainers || [];

    p.ip = p.ip || ipPod(n); p.initLogs = p.initLogs || {};
    for (let k = p.initIdx || 0; k < inits.length; k++){
      const ic = inits[k];
      const ii = imagenInfo(ic.image);
      if (!ii.ok){ const t = ahora() - p.creado; p.estado = (t % 20) < 4 ? "Init:ErrImagePull" : "Init:ImagePullBackOff"; p.fase = "Pending"; p.listo = false; p.razonImagen = ii; return; }
      const isc = ic.securityContext || {}, ipsc = p.spec.securityContext || {};
      if ((isc.runAsNonRoot ?? ipsc.runAsNonRoot) === true && perfil(ic).root && !((isc.runAsUser ?? ipsc.runAsUser) > 0)){
        p.estado = "Init:CreateContainerConfigError"; p.fase = "Pending"; p.listo = false;
        p.errorConfig = `container has runAsNonRoot and image will run as root (pod: "${p.name}_${p.ns}(${p.uid})", container: ${ic.name})`; return;
      }
      const envI = {}; for (const e of ic.env || []) if (e && e.name && "value" in e) envI[e.name] = String(e.value);
      const r = ejecutarProceso([...(ic.command || []), ...(ic.args || [])], envI, p, p.ns, perfil(ic), ic);
      const veces = r.bucle ? Math.min(30, 1 + Math.floor((ahora() - p.creado) / r.bucle.periodo)) : 1;
      p.initLogs[ic.name] = r.bucle ? [].concat(...Array(veces).fill(r.lineas)) : r.lineas;
      if (r.fin === "sale" && r.codigo === 0){ p.initIdx = k + 1; continue; }
      if (r.fin === "corriendo"){ p.estado = `Init:${k}/${inits.length}`; p.fase = "Pending"; p.listo = false; p.esperandoInit = ic.name; return; }
      const t = ahora() - p.creado; p.reinicios = 1 + Math.floor(t / CICLO_CRASH);
      p.ultimoInit = {nombre:ic.name, razon:r.fin === "starterror" ? "StartError" : "Error", codigo:r.codigo, msg:r.errorArranque};
      p.estado = (t % CICLO_CRASH) < 2 ? "Init:Error" : "Init:CrashLoopBackOff"; p.fase = "Pending"; p.listo = false; return;
    }
    p.initHecho = true; p.esperandoInit = null; p.reinicios = 0;

  const runAsUser = csc.runAsUser !== undefined ? csc.runAsUser : psc.runAsUser;
  if (runAsNonRoot === true && perfil(c).root && !(runAsUser > 0)){
    p.estado = "CreateContainerConfigError"; p.fase = "Pending"; p.listo = false;
    p.errorConfig = `container has runAsNonRoot and image will run as root (pod: "${p.name}_${p.ns}(${p.uid})", container: ${c.name})`; return;
  }

    }

  }
  if (muere){
    p.reinicios = 1 + Math.floor(vivo / CICLO_CRASH); p.ultimo = muere;
    p.estado = (vivo % CICLO_CRASH) < 2 ? muere.estadoCorto : "CrashLoopBackOff"; p.fase = "Running"; p.listo = false;
    return;
  }

  p.listos = [p.listo];

    const sc = p.spec.containers[k], l = (p.lados || [])[k - 1];
    if (!l){ p.listos.push(false); continue; }
    const pr = l.proc || {};
    if (pr.fin === "starterror" || pr.fin === "sale"){
      l.reinicios = 1 + Math.floor(vivo / CICLO_CRASH);
      l.ultimo = {razon:pr.fin === "starterror" ? "StartError" : pr.codigo === 0 ? "Completed" : "Error", codigo:pr.fin === "starterror" ? 128 : pr.codigo, msg:pr.errorArranque};
      l.estado = "CrashLoopBackOff"; p.listos.push(false);
      if (p.estado === "Running") p.estado = (vivo % CICLO_CRASH) < 2 ? (pr.fin === "starterror" ? "RunContainerError" : l.ultimo.razon === "Completed" ? "Completed" : "Error") : "CrashLoopBackOff";
      continue;
    }
    l.estado = "Running"; l.fallaReadiness = null;
    let ok = true;
    if (sc.readinessProbe){ const r = probarSonda(p, sc.readinessProbe, sc); ok = r.ok; l.fallaReadiness = r.ok ? null : r.msg; if (!r.ok && !p.fallaReadiness) p.fallaReadiness = r.msg; }
    p.listos.push(ok);
  }

}

/* ---------- scheduler ---------- */
function tolera(tols, taint){
  for (const t of tols || []){
    if (t.operator === "Exists" && !t.key) return true;

let CAPTURA = null;                       // si no es null, la salida normal se guarda aquí (tuberías)
let MODO = null;                          // shell interactiva: {tipo:"pod"|"nodo", …}
function out(t, cls){
  if (t === undefined || t === null) return;
  if (CAPTURA && cls !== "c-err" && cls !== "c-am" && cls !== "c-dim") { CAPTURA.push(String(t)); return; }
  pintarSalida(String(t), cls);
}
const err = m => out(m, "c-err");
const aviso = m => out(m, "c-am");
const nota = m => out(m, "c-dim");

/* ---------- troceado de la línea ---------- */
function trocear(s){
  const r = []; let act = "", q = null, hay = false;
  for (let i = 0; i < s.length; i++){
    const c = s[i];
    if (q){ if (c === q){ q = null; continue; } if (c === "\\" && q === '"' && s[i+1] === '"'){ act += '"'; i++; continue; } act += c; continue; }
    if (c === "'" || c === '"'){ q = c; hay = true; continue; }
    if (/\s/.test(c)){ if (act !== "" || hay) r.push(act); act = ""; hay = false; continue; }
    act += c;
  }
  if (q) throw new Error("comillas sin cerrar");
  if (act !== "" || hay) r.push(act);
  return r;
}
function partirFuera(s, sep){            // parte por un separador fuera de comillas
  const r = []; let act = "", q = null;
  for (let i = 0; i < s.length; i++){
    const c = s[i];
    if (q){ act += c; if (c === q) q = null; continue; }
    if (c === "'" || c === '"'){ q = c; act += c; continue; }
    if (s.startsWith(sep, i) && !(sep === "|" && (s[i+1] === "|" || s[i-1] === "|"))){ r.push(act); act = ""; i += sep.length - 1; continue; }
    act += c;
  }
  r.push(act); return r.map(x => x.trim());

/* ---------- label / annotate / taint / cordon / drain ---------- */

function kLabel(pos, f, ns){

  if (r.kind === "Node"){
    const ns_ = f.all ? S.nodes : nombres.map(n => S.nodes.find(x => x.name === n));
    if (ns_.some(x => !x)){ noExiste(r, nombres[ns_.findIndex(x => !x)]); return 1; }
    for (const n of ns_){ const base = etiquetasNodo(n); const prov = Object.assign({}, n.extra);
      for (const c of cambios){ const k = c.replace(/-$/, "").split("=")[0]; if (c.endsWith("-") && !(k in n.extra) && k in base){ err(`(simulador) la label «${k}» la pone EKS: no la quites`); return 1; } }

      for (const c of cambios){ const k = c.replace(/-$/, "").split("=")[0]; if (!c.endsWith("-") && base[k] !== undefined && !(k in n.extra) && base[k] !== prov[k] && !f.overwrite){ err(`error: '${k}' already has a value (${base[k]}), and --overwrite is false`); return 1; } }

{ id:39, mundo:5, t:"Calidad de servicio", tipo:"pregunta",
  m:"En nivel-39 hay tres Deployments: oro, plata y bronce.\n¿Qué clase QoS (QoS Class) tiene el Pod de «plata»?\n\nResponde con:  responder <clase>",

  resp:() => "Burstable",
  p:["Hay 3 clases: Guaranteed, Burstable y BestEffort","kubectl describe pod <pod-de-plata> -n nivel-39  → «QoS Class»","kubectl get pods -n nivel-39 -l app=plata -o jsonpath='{.items[0].status.qosClass}'"],

  sol:"kubectl describe pod -l app=plata -n nivel-39 | grep QoS\nresponder Burstable" },
{ id:40, mundo:5, t:"Autoescalado", tipo:"mision",
  m:"Crea un HorizontalPodAutoscaler «web» en nivel-40 (mínimo 1, máximo 4,\nobjetivo 50 % de CPU) y consigue que muestre la CPU real.",

  ok:() => { const h = obj("HorizontalPodAutoscaler","nivel-40","web"); return !!h && (h.spec.scaleTargetRef || {}).name === "web" && (h.spec.minReplicas || 1) === 1 && h.spec.maxReplicas === 4 && objetivoHPA(h) === 50 && !metricaHPA(h).error; },
  p:["kubectl autoscale deployment … -n nivel-40","Flags: --min=1 --max=4 --cpu-percent=50   (kubectl 1.36 también: --cpu=50%)","kubectl get hpa -n nivel-40  → TARGETS debe mostrar cpu: X%/50%"],
  a:"El HPA cambia el nº de Pods según métricas que da metrics-server (addon en EKS). Sin metrics-server, TARGETS = <unknown>.",
  sol:"kubectl autoscale deployment web --min=1 --max=4 --cpu-percent=50 -n nivel-40" },
{ id:41, mundo:5, t:"Autoescalado a ciegas", tipo:"mision",

  ok:() => { const h = obj("HorizontalPodAutoscaler","nivel-41","api"); return !!h && h.spec.maxReplicas === 5 && (h.spec.minReplicas || 1) === 1 && !metricaHPA(h).error; },
  p:["kubectl describe hpa api -n nivel-41  → «missing request for cpu»","El % de CPU se calcula sobre los REQUESTS","kubectl set resources deployment api --requests=cpu=50m -n nivel-41"],
  a:"HPA por % de CPU = uso ÷ requests. Sin requests no hay porcentaje posible.",

{ id:42, mundo:5, t:"Cuota agotada", tipo:"mision",
  m:"El Deployment «fila» (nivel-42) quiere 4 Pods pero solo tiene 2.\nConsigue los 4 sin reducir réplicas.",
  prep(){ mkNs("nivel-42"); guardarObj({apiVersion:"v1", kind:"ResourceQuota", metadata:metaNueva("limite-pods","nivel-42"), spec:{hard:{pods:"2"}}}); mkDep("nivel-42","fila",{replicas:4}); },
  ok:() => { const d = dObj("nivel-42","fila"); return !!d && d.spec.replicas === 4 && listos("nivel-42","fila") === 4; },
  p:["kubectl get events -n nivel-42  → «exceeded quota» (los Pods que faltan ni existen)","kubectl describe resourcequota -n nivel-42","kubectl edit resourcequota limite-pods -n nivel-42  y sube pods a \"4\""],
  a:"Las cuotas limitan lo que consume un namespace. El fallo no está en ningún Pod (no llegan a existir): se ve en los eventos del ReplicaSet.",
  sol:"kubectl edit resourcequota limite-pods -n nivel-42   → pods: \"4\"\n   o: kubectl patch resourcequota limite-pods -n nivel-42 -p '{\"spec\":{\"hard\":{\"pods\":\"4\"}}}'" },
{ id:43, mundo:5, t:"Sin hueco", tipo:"mision",
  m:"Algunos Pods de «relleno» (nivel-43) no caben en ningún nodo.\nHaz que arranquen TODOS sin reducir réplicas.\n(en AWS añadir un nodo cuesta 0,0456 $/h)",
  prep(){ mkNs("nivel-43"); reconciliar();
          const libres = S.nodes.filter(n => n.ready && !n.unsched && !n.terminando).reduce((a, n) => a + n.alloc.pods - usoNodo(n).pods, 0);
          S.datos.relleno = libres + 3; mkDep("nivel-43","relleno",{replicas:libres + 3}); },
  ok:() => { const d = dObj("nivel-43","relleno"); return !!d && d.spec.replicas >= S.datos.relleno && listos("nivel-43","relleno") === d.spec.replicas; },
  p:["kubectl describe pod <uno-Pending> -n nivel-43  → «Too many pods»","Hacen falta más nodos: eso es el node group de AWS, no kubectl","aws eks update-nodegroup-config --cluster-name eks-juego --nodegroup-name ng-juego --scaling-config minSize=1,maxSize=2,desiredSize=2   (si ya tienes 2: maxSize=3,desiredSize=3)"],
  a:"Cuando no caben Pods se añaden nodos: a mano (node group), con Cluster Autoscaler o con Karpenter (lo hace solo en segundos).",
  sol:"aws eks update-nodegroup-config --cluster-name eks-juego --nodegroup-name ng-juego --scaling-config minSize=1,maxSize=2,desiredSize=2" },
{ id:44, mundo:5, t:"Nodo vetado", tipo:"mision",

  ok:() => listos("nivel-44","urgente") === 1,

  a:"Los taints repelen Pods; las tolerations les dejan pasar. Así se reservan nodos (GPU, sistema…) o se sacan de servicio.",
  sol:"kubectl taint nodes --all mantenimiento-\n   o en el Deployment: tolerations: [{key: mantenimiento, operator: Exists}]" },
{ id:45, mundo:5, t:"Etiqueta que falta", tipo:"mision",

{ id:46, mundo:5, t:"Mantenimiento", tipo:"mision",

{ id:48, mundo:6, t:"Permisos mínimos", tipo:"mision",
  m:"Haz que la ServiceAccount «lector» (nivel-48) pueda VER (get, list, watch)\nlos Pods de nivel-48… y NADA más.",

{ id:49, mundo:6, t:"Demasiados permisos", tipo:"mision",

          guardarObj({apiVersion:"rbac.authorization.k8s.io/v1", kind:"RoleBinding", metadata:metaNueva("bot-todo","nivel-49"), roleRef:{apiGroup:"rbac.authorization.k8s.io", kind:"ClusterRole", name:"admin"}, subjects:[{kind:"ServiceAccount", name:"bot", namespace:"nivel-49"}]}); },
  ok:() => { const sa = "system:serviceaccount:nivel-49:bot"; return puede(sa,"list","deployments","nivel-49") && puede(sa,"get","pods","nivel-49") && !puede(sa,"delete","deployments","nivel-49") && !puede(sa,"create","pods","nivel-49") && !puede(sa,"delete","pods","nivel-49"); },

  sol:"kubectl delete rolebinding bot-todo -n nivel-49\nkubectl create rolebinding bot-lectura --clusterrole=view --serviceaccount=nivel-49:bot -n nivel-49" },
{ id:50, mundo:6, t:"Muro de fuego", tipo:"mision",
  m:"Una NetworkPolicy bloquea todo el tráfico entrante en nivel-50.\nPermite SOLO que «cliente» hable con «web», sin borrar «denegar-todo».",
  prep(){ mkNs("nivel-50"); mkDep("nivel-50","web",{ports:[{containerPort:80}]}); mkSvc("nivel-50","web");
          mkDep("nivel-50","cliente",{image:"busybox:1.37", cmd:["sleep","3600"], readiness:{exec:{command:["wget","-qO-","-T","2","http://web"]}, periodSeconds:5, timeoutSeconds:3}});
          guardarObj({apiVersion:"networking.k8s.io/v1", kind:"NetworkPolicy", metadata:metaNueva("denegar-todo","nivel-50"), spec:{podSelector:{}, policyTypes:["Ingress"]}}); },
  ok:() => !!obj("NetworkPolicy","nivel-50","denegar-todo") && listos("nivel-50","cliente") === 1,
  p:["kubectl get networkpolicy -n nivel-50   y   kubectl describe networkpolicy denegar-todo -n nivel-50","Las políticas se SUMAN: añade otra que permita de app=cliente a app=web","kubectl apply -f -  con una NetworkPolicy «permitir-cliente»: podSelector app=web, ingress from podSelector app=cliente"],
  a:"Por defecto todo Pod habla con todo Pod. «Denegar todo» + permisos explícitos = red de mínimo privilegio. En EKS hace falta activar enableNetworkPolicy en la VPC CNI.",
  sol:"kubectl apply -f -   (y pega:)\napiVersion: networking.k8s.io/v1\nkind: NetworkPolicy\nmetadata:\n  name: permitir-cliente\n  namespace: nivel-50\nspec:\n  podSelector:\n    matchLabels:\n      app: web\n  policyTypes: [\"Ingress\"]\n  ingress:\n  - from:\n    - podSelector:\n        matchLabels:\n          app: cliente" },
{ id:51, mundo:6, t:"Pod Security", tipo:"mision",
  m:"nivel-51 solo admite Pods «restricted» (Pod Security Admission).\nHaz que «inseguro» tenga 1 Pod listo, SIN quitar esa etiqueta del namespace.",
  prep(){ mkNs("nivel-51", {"pod-security.kubernetes.io/enforce":"restricted"}); S.ns["nivel-51"].labels["pod-security.kubernetes.io/enforce"] = "restricted"; mkDep("nivel-51","inseguro"); },

  a:"Pod Security Admission bloquea Pods inseguros por namespace (labels pod-security.kubernetes.io/*). Una imagen que corre como root no pasa runAsNonRoot.",
