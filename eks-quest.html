<script>
const CHULETAS = {"CHULETAS.md": "# Chuletas: índice\n\nTodas sirven para el EKS real y para el juego. Empieza por la de comandos; las demás son para cuando algo concreto te pasa.\n\n## Qué chuleta mirar según lo que te pasa\n\n| Lo que ves | Chuleta | Sección |\n|---|---|---|\n| No sé ni por dónde empezar | CHULETA-COMANDOS | Lo primero: tres palabras |\n| Sé qué falla (un Service, un nodo, un permiso…) pero no cómo crearlo o cambiarlo | CHULETA-COMANDOS | 🔎 Índice por recurso |\n| Veo un STATUS o un síntoma y no sé dónde se arregla | CHULETA-COMANDOS | 7. Diagnosticar (columna «Se arregla en») |\n| Un Pod en `Pending` | CHULETA-DIAGNOSTICO | Pending |\n| Un Pod en `ErrImagePull` o `ImagePullBackOff` | CHULETA-DIAGNOSTICO | Imagen |\n| Un Pod en `CreateContainerConfigError` | CHULETA-DIAGNOSTICO | Configuración |\n| Un Pod en `CrashLoopBackOff` o con RESTARTS que suben | CHULETA-DIAGNOSTICO | Se reinicia |\n| `OOMKilled` o Exit Code 137 | CHULETA-CAPACIDAD | Memoria y CPU |\n| `Running` pero `0/1` en READY | CHULETA-DIAGNOSTICO | Running pero no listo |\n| El Deployment quiere N Pods y hay menos (ni siquiera Pending) | CHULETA-DIAGNOSTICO | FailedCreate |\n| Un Service sin endpoints, o con endpoints que no responden | CHULETA-RED | Services y puertos |\n| Nada resuelve nombres, o no llego a otro namespace | CHULETA-RED | DNS |\n| Quiero escribir un objeto en YAML | CHULETA-YAML | La plantilla del tipo que necesites |\n| `Forbidden`, `Unauthorized` o \"¿quién puede hacer qué?\" | CHULETA-SEGURIDAD | IAM y RBAC |\n| Pod Security, Secrets, contenedores como root | CHULETA-SEGURIDAD | Pod Security |\n| No caben Pods, taints, nodeSelector, cuotas, HPA, drain, PDB | CHULETA-CAPACIDAD | |\n| Nodos, node group, instancias EC2, versión del cluster, costes | CHULETA-AWS-EKS | |\n| Un Pod en `Init:0/1` o `Init:CrashLoopBackOff` | CHULETA-BAJO-EL-CAPO | Init containers |\n| Quiero ver por dentro: PID 1, cgroups, capabilities, token | CHULETA-BAJO-EL-CAPO | |\n| Una imagen sin shell (`exec` no sirve) | CHULETA-BAJO-EL-CAPO | kubectl debug |\n| Un Pod `READY 1/2`, sidecars, contenedores que comparten red o ficheros | CHULETA-BAJO-EL-CAPO | Pods con varios contenedores |\n| IP de un Pod, DNS por dentro, cómo funciona un Service (kube-proxy, iptables) | CHULETA-RED · CHULETA-BAJO-EL-CAPO | La red del Pod |\n| Mirar desde el nodo: crictl, PIDs, cgroups, kubelet | CHULETA-BAJO-EL-CAPO | Desde el nodo |\n| Permisos en todo el cluster, o credenciales de AWS para un Pod | CHULETA-BAJO-EL-CAPO | ClusterRole · Pod Identity |\n\n## Todas las chuletas\n\n| Fichero | Para qué |\n|---|---|\n| CHULETA-COMANDOS.md | Los comandos de kubectl por tarea: mirar, crear, cambiar, borrar, entrar en Pods, nodos |\n| CHULETA-DIAGNOSTICO.md | Árbol de averías por STATUS: qué significa, el mensaje típico y cómo confirmarlo |\n| CHULETA-YAML.md | Plantillas mínimas comentadas de cada tipo de objeto y errores típicos de YAML |\n| CHULETA-RED.md | Services, puertos, DNS, port-forward, NetworkPolicy, VPC CNI y balanceadores |\n| CHULETA-SEGURIDAD.md | IAM frente a RBAC, Roles, ServiceAccounts, Secrets, Pod Security, securityContext |\n| CHULETA-CAPACIDAD.md | requests y limits, scheduler, QoS, cuotas, HPA, taints, drain, PDB, DaemonSets |\n| CHULETA-AWS-EKS.md | AWS CLI para operar EKS: identidad, cluster, node groups, instancias, SSM y costes |\n| CHULETA-BAJO-EL-CAPO.md | Dentro del contenedor: PID 1, cgroups, capabilities, token, init containers, kubectl debug, ClusterRoles y Pod Identity |\n\n## El método que sirve casi siempre\n\n```text\n1. kubectl get pods -n <ns>                    → ¿qué STATUS tiene?\n2. kubectl describe pod <pod> -n <ns>          → lee los Events del final\n3. kubectl logs <pod> -n <ns> [--previous]     → ¿qué dice la aplicación?\n4. Si el Pod está bien pero no llega tráfico   → describe svc / get endpoints\n```\n\nSi \"todo falla a la vez\", mira primero `kube-system` (`kubectl get pods -n kube-system`): CoreDNS, aws-node y kube-proxy sostienen al resto.\n\n## Antes de tocar nada en el EKS real\n\n- Comprueba la cuenta: `aws sts get-caller-identity` (¿es tu cuenta de laboratorio y no la de producción?).\n- Comprueba el cluster: `kubectl config current-context`.\n- Comprueba el namespace: casi todos los comandos llevan `-n <ns>`.\n", "CHULETA-AWS-EKS.md": "# Chuleta de AWS CLI para operar EKS\n\nkubectl habla con Kubernetes. La AWS CLI habla con AWS: el cluster como recurso, los node groups, las instancias EC2 y la identidad. En el día a día se usan las dos.\n\n## ⚠️ Antes de nada: cuenta y región\n\n```bash\naws sts get-caller-identity                 # ¿es la cuenta que esperas? (en el juego: 123456789012)\nexport AWS_PROFILE=mi-laboratorio AWS_REGION=eu-west-1\naws sso login --profile mi-laboratorio      # si la sesión ha caducado\n```\n\nSi tienes varios perfiles (laboratorio, trabajo, **producción**…), mira qué `AWS_PROFILE` tienes en tu `~/.bashrc` o en la sesión actual. Comprueba la cuenta antes de cualquier comando que cree, cambie o borre.\n\n## Identidad\n\n```bash\naws sts get-caller-identity                                   # cuenta, ARN y usuario/rol\naws sts get-caller-identity --query Account --output text     # solo la cuenta\n```\n\nEs lo primero que se mira ante un `Unauthorized` en kubectl: credencial caducada, otra cuenta u otro rol.\n\n## El cluster\n\n```bash\naws eks list-clusters\naws eks describe-cluster --name <cluster> --query 'cluster.[status,version,endpoint]' --output text\naws eks describe-cluster --name <cluster> --query cluster.version --output text      # ej. 1.36\naws eks describe-cluster --name <cluster> --query cluster.arn --output text          # incluye la cuenta\naws eks describe-cluster --name <cluster> --query cluster.upgradePolicy              # STANDARD o EXTENDED\naws eks describe-cluster-versions --query 'clusterVersions[].[clusterVersion,status,endOfStandardSupportDate]' --output text\n```\n\nConectar kubectl a un cluster (escribe en `~/.kube/config`):\n\n```bash\naws eks update-kubeconfig --name <cluster> --alias <cluster>\nkubectl config current-context\n```\n\n## Insights: avisos antes de actualizar\n\n```bash\naws eks list-insights --cluster-name <cluster>\naws eks list-insights --cluster-name <cluster> --filter categories=UPGRADE_READINESS\naws eks describe-insight --cluster-name <cluster> --id <insight-id>\n```\n\nLas categorías incluyen `UPGRADE_READINESS` (cosas que romperían el upgrade) y `MISCONFIGURATION`. El formato exacto de `--filter` está en `aws eks list-insights help`.\n\n## Node groups: los nodos gestionados\n\n```bash\naws eks list-nodegroups --cluster-name <cluster>\naws eks describe-nodegroup --cluster-name <cluster> --nodegroup-name <ng> \\\n  --query 'nodegroup.[status,instanceTypes,amiType,scalingConfig]'\n\n# Cambiar el número de nodos: desiredSize siempre entre minSize y maxSize\naws eks update-nodegroup-config --cluster-name <cluster> --nodegroup-name <ng> \\\n  --scaling-config minSize=1,maxSize=3,desiredSize=2\n```\n\nDurante el cambio, el node group está en `UPDATING`. La EC2 nueva tarda unos minutos en aparecer como `Ready` en `kubectl get nodes -w`.\n\n## De nodo de Kubernetes a instancia EC2\n\nEl nombre del nodo es su DNS privado, y el `providerID` lleva la zona y el ID de la instancia:\n\n```bash\nkubectl get node <nodo> -o jsonpath='{.spec.providerID}'\n# aws:///eu-west-1a/i-0123456789abcdef0\nkubectl get nodes -o jsonpath='{range .items[*]}{.metadata.name}{\"  \"}{.spec.providerID}{\"\\n\"}{end}'\n```\n\nLas instancias de un node group llevan el tag `eks:nodegroup-name`:\n\n```bash\naws ec2 describe-instances \\\n  --filters Name=tag:eks:nodegroup-name,Values=<ng> Name=instance-state-name,Values=running \\\n  --query 'Reservations[].Instances[].[InstanceId,PrivateDnsName,Placement.AvailabilityZone,State.Name]' \\\n  --output table\n```\n\n## Sustituir un nodo roto\n\nEn EKS un nodo que falla no se repara: se termina y el node group (un Auto Scaling Group por debajo) lanza otro para mantener `desiredSize`.\n\n```bash\nkubectl get nodes                                         # ¿cuál está NotReady?\nkubectl get node <nodo> -o jsonpath='{.spec.providerID}'  # → i-…\nkubectl describe node <nodo> | grep ProviderID            # lo mismo, sin jsonpath\nkubectl drain <nodo> --ignore-daemonsets --delete-emptydir-data --timeout=120s   # si aún responde\naws ec2 terminate-instances --instance-ids <i-…>\nkubectl get nodes -w                                      # aparece uno nuevo en unos minutos\n```\n\n⚠️ `terminate-instances` es irreversible. Comprueba antes el ID, la cuenta y que la instancia es del node group.\n\n## Entrar en un nodo sin SSH (Session Manager)\n\nNecesita la política `AmazonSSMManagedInstanceCore` en el rol del nodo y el plugin de Session Manager en tu PC.\n\n```bash\naws ssm start-session --target <i-…>\n# dentro del nodo:\nsudo systemctl status kubelet\nsudo journalctl -u kubelet -n 50 --no-pager\nsudo crictl ps\nexit\n```\n\nUn comando sin sesión interactiva (por ejemplo, en un script):\n\n```bash\naws ssm send-command --instance-ids <i-…> --document-name AWS-RunShellScript \\\n  --parameters 'commands=[\"systemctl is-active kubelet\"]' \\\n  --query Command.CommandId --output text\naws ssm get-command-invocation --command-id <id> --instance-id <i-…> \\\n  --query '[Status,StandardOutputContent]' --output text\n```\n\n## Addons gestionados\n\n```bash\naws eks list-addons --cluster-name <cluster>\naws eks describe-addon --cluster-name <cluster> --addon-name vpc-cni \\\n  --query 'addon.[addonVersion,status,configurationValues]'\naws eks describe-addon-versions --addon-name coredns --kubernetes-version 1.36 \\\n  --query 'addons[0].addonVersions[0].addonVersion' --output text\n```\n\n## Costes de referencia (eu-west-1, comprobados el 26/11/2026)\n\n| Recurso | Precio | Al mes si se queda encendido |\n|---|---|---|\n| Control plane EKS (soporte estándar) | 0,10 $/h | 73 $ |\n| Control plane EKS en soporte extendido | 0,60 $/h | 438 $ |\n| Nodo t3.medium | 0,0456 $/h | 33,29 $ |\n| NAT Gateway | 0,048 $/h + 0,048 $/GB | 35,04 $ + tráfico |\n| IPv4 pública | 0,005 $/h | 3,65 $ |\n| ALB | 0,0252 $/h + 0,008 $/LCU-h | 18,40 $ + uso |\n| EBS gp3 | 0,088 $/GB-mes | 1,76 $ por 20 GB |\n\n- Un cluster de laboratorio olvidado (control plane + 1 nodo + IP) cuesta unos 3,6 $ al día.\n- El soporte extendido viene activado por defecto al crear un cluster: créalo con `--upgrade-policy supportType=STANDARD`.\n- Antes de borrar un cluster, borra sus Services LoadBalancer y sus volúmenes: si no, quedan recursos huérfanos cobrando.\n\n```bash\naws eks list-clusters                                              # ¿queda algo encendido?\naws elbv2 describe-load-balancers --query 'LoadBalancers[].[LoadBalancerName,VpcId]' --output text\naws ec2 describe-volumes --filters Name=status,Values=available --query 'Volumes[].[VolumeId,Size]' --output text\n```\n\n## Lo que hace cada herramienta\n\n| Quiero… | Herramienta |\n|---|---|\n| Ver o cambiar Pods, Deployments, Services, RBAC | kubectl |\n| Ver la versión, el endpoint o el estado del cluster | `aws eks describe-cluster` |\n| Añadir o quitar nodos | `aws eks update-nodegroup-config` |\n| Saber qué instancia EC2 es un nodo | `kubectl get node … providerID` + `aws ec2 describe-instances` |\n| Sustituir un nodo | `aws ec2 terminate-instances` |\n| Entrar en un nodo | `aws ssm start-session` |\n| Saber quién soy | `aws sts get-caller-identity` |\n", "CHULETA-BAJO-EL-CAPO.md": "# Chuleta: bajo el capó (qué hay DENTRO de un contenedor)\n\nUn contenedor no es una máquina virtual. Es un **proceso normal del nodo** al que Linux le pone tres cosas:\n\n| Pieza de Linux | Qué hace | Dónde lo ves |\n|---|---|---|\n| **namespaces** | Aíslan lo que el proceso VE: sus propios PIDs, su red, su hostname, sus montajes | `ps` dentro: tu programa es el PID 1 |\n| **cgroups** (v2) | Limitan lo que el proceso GASTA: memoria, CPU, número de procesos | `/sys/fs/cgroup/` |\n| **capabilities + seccomp** | Recortan lo que el proceso PUEDE HACER, aunque sea root | `/proc/1/status` |\n\nKubernetes no inventa nada: el kubelet traduce tu YAML a estas piezas y se lo pasa a containerd.\n\n## 1. Procesos: el PID 1\n\n```bash\nkubectl exec -it <pod> -n <ns> -- sh\nps                          # PID 1 = el programa de la imagen (CMD/ENTRYPOINT)\ncat /proc/1/cmdline         # el comando exacto del PID 1\ncat /proc/1/environ         # sus variables de entorno (en el real van separadas por \\0: tr '\\0' '\\n')\n```\n\n- Si el PID 1 termina, el contenedor termina. Por eso nginx corre con `daemon off;` (en primer plano).\n- En el **nodo**, ese mismo proceso tiene otro PID cualquiera: el PID 1 es solo «dentro de su namespace».\n- `shareProcessNamespace: true` en el Pod hace que todos sus contenedores vean los procesos de todos (y el PID 1 pasa a ser `/pause`).\n\n## 2. cgroups: los requests y limits, escritos en ficheros\n\n| En el YAML | Fichero del cgroup v2 | Ejemplo |\n|---|---|---|\n| `limits.memory: 128Mi` | `memory.max` | `134217728` (128 × 1024 × 1024 bytes) |\n| sin `limits.memory` | `memory.max` | `max` (sin límite: puede comerse el nodo) |\n| `limits.cpu: 250m` | `cpu.max` | `25000 100000` = 25 ms de cada 100 ms |\n| `requests.cpu: 250m` | `cpu.weight` | `10` (el reparto cuando varios compiten) |\n| `requests.memory` | (ninguno) | sirve al scheduler y a la prioridad de OOM, no se escribe aquí |\n\n```bash\ncat /sys/fs/cgroup/memory.max       # el límite\ncat /sys/fs/cgroup/memory.current   # lo que usa AHORA\ncat /sys/fs/cgroup/memory.events    # oom_kill N → cuántas veces lo ha matado el kernel\ncat /sys/fs/cgroup/cpu.max          # «cuota periodo»\ncat /sys/fs/cgroup/cpu.stat         # nr_throttled / throttled_usec → ¿le frenan la CPU?\n```\n\n- **Memoria**: si `memory.current` llega a `memory.max`, el kernel mata el proceso → `OOMKilled`, exit code 137.\n- **CPU**: si gasta su cuota antes de acabar el periodo, el kernel lo **frena** (throttling). No muere: va lento. Una aplicación lenta con `nr_throttled` subiendo pide más `limits.cpu`.\n\n## 3. Usuario y capabilities\n\n```bash\nid                                   # uid=0(root) o uid=101(nginx)…\ngrep -E 'Uid|Cap|NoNewPrivs|Seccomp' /proc/1/status\n```\n\n| Línea | Qué significa |\n|---|---|\n| `Uid:` | El usuario real. `runAsUser` en el securityContext lo cambia |\n| `CapEff:` | Capabilities EFECTIVAS (máscara hexadecimal). `00000000a80425fb` = las 14 que da containerd por defecto. `0000000000000000` = ninguna |\n| `CapBnd:` | El tope que nunca podrá superar (aunque ejecute un programa setuid) |\n| `NoNewPrivs: 1` | `allowPrivilegeEscalation: false`: ningún programa puede ganar privilegios |\n| `Seccomp: 2` | Filtro de llamadas al sistema activo (`seccompProfile: RuntimeDefault`) |\n\nPara traducir la máscara a nombres (en un Linux con `libcap`, no en busybox): `capsh --decode=00000000a80425fb`.\n\nUn usuario que no es root tiene `CapEff` a cero aunque no quites nada. Lo más seguro es las dos cosas: `runAsNonRoot: true` **y** `capabilities: {drop: [\"ALL\"]}`. Si la aplicación necesita una concreta (por ejemplo, abrir el puerto 80), se añade solo esa: `add: [\"NET_BIND_SERVICE\"]`.\n\n## 4. El token de la ServiceAccount\n\n```bash\nls /var/run/secrets/kubernetes.io/serviceaccount/     # ca.crt  namespace  token\ncat /var/run/secrets/kubernetes.io/serviceaccount/token\n```\n\n- Es la credencial del Pod frente a la API de Kubernetes. Caduca y el kubelet la renueva sola.\n- Si la aplicación no habla con la API, **no la montes**: `automountServiceAccountToken: false` en la ServiceAccount (vale para todos sus Pods) o en el `spec` del Pod.\n- Se decide **al crear el Pod**: si cambias la ServiceAccount, los Pods que ya existen siguen con el token → `kubectl rollout restart`.\n\n## 5. Init containers\n\n```yaml\nspec:\n  initContainers:\n  - name: espera-bd\n    image: busybox:1.37\n    command: [\"sh\", \"-c\", \"until nslookup bd; do echo esperando a bd; sleep 2; done\"]\n  containers:\n  - name: app\n    image: nginx:1.27-alpine\n```\n\n| STATUS | Qué pasa |\n|---|---|\n| `Init:0/1` | El primer init container aún no ha terminado (¿espera algo?) |\n| `Init:Error` / `Init:CrashLoopBackOff` | Un init container falla: se reintenta con espera creciente |\n| `PodInitializing` | Los init terminaron; arranca el contenedor principal |\n\n```bash\nkubectl logs <pod> -c espera-bd -n <ns>          # los logs de UN contenedor concreto\nkubectl describe pod <pod> -n <ns>               # sección «Init Containers»\n```\n\nSe ejecutan **en orden** y cada uno tiene que acabar bien (exit 0) antes del siguiente. Pod Security también se aplica a ellos.\n\n## 6. kubectl debug: entrar donde no hay shell\n\nLas imágenes mínimas («distroless», `pause`…) no traen `sh`, ni `ps`, ni `cat`: `kubectl exec` no sirve.\n\n```bash\n# contenedor EFÍMERO dentro del Pod, compartiendo los procesos del contenedor objetivo\nkubectl debug -it <pod> -n <ns> --image=busybox:1.37 --target=<contenedor>\nps                         # ves el PID 1 del objetivo\nls /proc/1/root/           # su sistema de ficheros (puede dar «Permission denied» si los usuarios no coinciden)\n\n# depurar un NODO: un Pod con los namespaces del host; su disco está en /host\nkubectl debug node/<nodo> -it --image=busybox:1.37\n```\n\n- Sin `--target` compartes la red del Pod, pero no ves sus procesos.\n- Un contenedor efímero no se puede quitar: desaparece cuando se borra el Pod.\n\n## 7. Permisos de cluster: ClusterRole y ClusterRoleBinding\n\n| Quiero dar… | Objeto «qué» | Objeto «a quién» |\n|---|---|---|\n| permisos en UN namespace | Role | RoleBinding |\n| permisos en TODOS los namespaces | ClusterRole | ClusterRoleBinding |\n| un ClusterRole reutilizable, pero solo en un namespace | ClusterRole | RoleBinding |\n\n```bash\nkubectl create clusterrole ver-pods-global --verb=get,list,watch --resource=pods\nkubectl create clusterrolebinding auditor-ver-pods --clusterrole=ver-pods-global --serviceaccount=<ns>:<sa>\nkubectl auth can-i list pods -A --as=system:serviceaccount:<ns>:<sa>      # -A = en todos los namespaces\nkubectl auth can-i list secrets -n kube-system --as=system:serviceaccount:<ns>:<sa>   # lo que NO debe poder\n```\n\nCuidado con los atajos: los ClusterRoles `view`, `edit` y `admin` dan mucho más de lo que parece. Mínimo privilegio es escribir el tuyo.\n\n## 8. Pods con varios contenedores (sidecars)\n\nUn Pod puede llevar varios contenedores: la aplicación y sus «ayudantes» (sidecars: recoger logs, hacer de proxy, vigilar…).\n\n| Comparten | No comparten |\n|---|---|\n| La **red**: misma IP, se hablan por `localhost` (y no pueden usar el mismo puerto) | Sistema de ficheros: cada uno el de su imagen |\n| Los **volúmenes** que monten los dos (p. ej. un `emptyDir`) | cgroup, límites y sondas: cada contenedor los suyos |\n| Los procesos, **solo** con `shareProcessNamespace: true` (el PID 1 pasa a ser `/pause`) | Variables de entorno |\n\n```bash\nkubectl get pods -n <ns>                                  # READY 1/2 = 1 de 2 contenedores listo\nkubectl describe pod <pod> -n <ns>                        # un bloque por contenedor: State, Ready, Restart Count, sondas\nkubectl logs <pod> -c <contenedor> -n <ns>                # los logs de UNO\nkubectl logs <pod> --all-containers --prefix -n <ns>      # los de todos, con prefijo\nkubectl exec -it <pod> -c <contenedor> -n <ns> -- sh      # entrar en UNO\nkubectl set env deployment/<dep> -c <contenedor> CLAVE=valor -n <ns>   # sin -c, va al primero\n```\n\nPara añadir un sidecar: `kubectl edit deployment <dep>` y otro elemento en `containers:` (con su `name`, `image`, `command` y, si comparte ficheros, el mismo volumen en `volumeMounts`):\n\n```yaml\n      volumes:\n      - name: logs\n        emptyDir: {}\n      containers:\n      - name: app\n        image: busybox:1.37\n        volumeMounts: [{name: logs, mountPath: /var/log}]\n      - name: sidecar\n        image: busybox:1.37\n        command: [\"/bin/sh\", \"-c\", \"tail -n+1 -f /var/log/app.log\"]\n        volumeMounts: [{name: logs, mountPath: /var/log}]\n```\n\n## 9. La red del Pod\n\n```bash\nkubectl get pods -n <ns> -o wide                       # IP de cada Pod (de la VPC, la da la VPC CNI)\nkubectl exec <pod> -n <ns> -- hostname -i              # la IP, desde dentro\nkubectl exec <pod> -n <ns> -- ip addr                  # eth0 con la IP del Pod (/32)\nkubectl exec <pod> -n <ns> -- cat /etc/resolv.conf     # nameserver = IP del Service kube-dns · search · ndots:5\nkubectl exec <pod> -n <ns> -- cat /etc/hosts           # el Pod se resuelve a sí mismo\nkubectl run t --rm -it --image=busybox:1.37 -n <ns> -- wget -qO- -T 2 http://<ip-del-pod>:<puerto>   # directo al Pod, sin Service\n```\n\n- Pod → Pod: directo por IP, sin NAT. Pod → Service: la IP del Service es virtual y la traducen las reglas de kube-proxy (abajo).\n- Un Service solo reparte a los Pods **listos** (sus endpoints): `kubectl get endpoints <svc> -n <ns>`.\n\n## 10. Desde el nodo: el contenedor como proceso\n\nEntra con `kubectl debug node/<nodo> -it --image=busybox:1.37` (o `aws ssm start-session --target <instance-id>`).\n\n```bash\ncrictl pods                                   # los Pods (sandboxes) del nodo\ncrictl ps [-a] [--name <contenedor>]          # sus contenedores (-a: también los muertos)\ncrictl inspect <id> | grep pid                # PID del proceso EN EL NODO\ncat /proc/<pid>/cgroup                        # /kubepods.slice/kubepods-<qos>.slice/kubepods-<qos>-pod<uid>.slice/cri-containerd-<id>.scope\ncat /proc/<pid>/oom_score_adj                 # Guaranteed -997 · Burstable 2-999 · BestEffort 1000\nnsenter -t <pid> -n ip addr                   # entra SOLO en la red del contenedor (ves la IP del Pod)\nps aux                                        # kubelet, containerd y los procesos de los contenedores\niptables-save | grep <service>                # reglas de kube-proxy: KUBE-SVC → KUBE-SEP → DNAT a <ip-pod>:<targetPort>\nsystemctl status kubelet · journalctl -u kubelet -n 50\n```\n\n- Dentro del contenedor, `cat /proc/self/cgroup` da `0::/`: tiene su propio namespace de cgroup. La ruta real solo se ve desde el nodo.\n- Si el nodo se queda sin memoria, el kernel mata primero al de `oom_score_adj` más alto: por eso los requests importan.\n\n## 11. EKS Pod Identity: credenciales de AWS sin claves\n\n```bash\naws eks create-pod-identity-association --cluster-name <cluster> \\\n  --namespace <ns> --service-account <sa> --role-arn arn:aws:iam::<cuenta>:role/<rol>\naws eks list-pod-identity-associations --cluster-name <cluster>\nkubectl rollout restart deployment <dep> -n <ns>      # los Pods ya creados no la ven\nkubectl exec deploy/<dep> -n <ns> -- env | grep AWS_  # dentro: AWS_CONTAINER_CREDENTIALS_FULL_URI…\n```\n\n- Necesita el add-on `eks-pod-identity-agent` (un DaemonSet en `kube-system`) y un rol IAM cuya política de confianza admita a `pods.eks.amazonaws.com` (`sts:AssumeRole` y `sts:TagSession`).\n- Los SDK de AWS leen esas variables solos: no hay claves en Secrets que se puedan filtrar ni caducar.\n", "CHULETA-CAPACIDAD.md": "# Chuleta de capacidad: recursos, scheduler, escalado y mantenimiento\n\n## requests y limits\n\n| Campo | Lo usa | Efecto |\n|---|---|---|\n| `requests.cpu` / `requests.memory` | El scheduler | Reserva: el Pod solo va a un nodo donde quepa lo pedido |\n| `limits.memory` | El kernel (cgroups) | Si se supera, el proceso muere: OOMKilled, Exit Code 137 |\n| `limits.cpu` | El kernel (cgroups) | Si se supera, el proceso se frena (*throttling*), no muere |\n\nUnidades: CPU en milésimas (`100m` = 0,1 CPU; `1` = 1 CPU). Memoria en `Mi`/`Gi` (potencias de 2) o `M`/`G` (potencias de 10).\n\n```bash\nkubectl set resources deployment <app> --requests=cpu=100m,memory=64Mi --limits=memory=128Mi -n <ns>\nkubectl describe node <nodo> | grep -A8 \"Allocated resources\"    # cuánto está reservado\nkubectl top pods -n <ns>                                         # cuánto se usa de verdad\n```\n\nEl scheduler mira los **requests**, no el uso real. Un nodo puede estar \"lleno\" con la CPU ociosa.\n\n## Cómo decide el scheduler\n\nPara cada nodo, primero filtra (¿puede ir aquí?) y luego puntúa (¿dónde mejor?). Si ningún nodo pasa los filtros, el Pod se queda Pending.\n\n| Filtro | Mensaje si no se cumple |\n|---|---|\n| Caben los requests de CPU | `Insufficient cpu` |\n| Caben los requests de memoria | `Insufficient memory` |\n| Quedan huecos de Pod (máximo por nodo) | `Too many pods` |\n| Tolera los taints del nodo | `had untolerated taint {clave: valor}` |\n| Cumple `nodeSelector` / affinity | `didn't match Pod's node affinity/selector` |\n| El nodo no está en cordon | `node(s) were unschedulable` |\n\n## QoS: quién muere primero\n\n| Clase | Cuándo | Prioridad al desalojar |\n|---|---|---|\n| Guaranteed | Todos los contenedores con requests = limits de CPU y memoria | Lo último en salir |\n| Burstable | Algún request o limit, sin llegar a Guaranteed | En medio |\n| BestEffort | Ningún request ni limit | Lo primero en salir |\n\nSi un nodo se queda sin memoria, el kubelet desaloja primero los BestEffort, luego los Burstable y al final los Guaranteed (documentación oficial de QoS).\n\n```bash\nkubectl get pod <pod> -n <ns> -o jsonpath='{.status.qosClass}'\nkubectl describe pod <pod> -n <ns> | grep \"QoS Class\"\n```\n\n## OOMKilled frente a throttling\n\n| Síntoma | Causa | Dónde se ve |\n|---|---|---|\n| Reinicios con `Reason: OOMKilled`, Exit Code 137 | Superó `limits.memory` | `kubectl describe pod` → Last State |\n| La app va lenta, sin reinicios | Llega a `limits.cpu` y se frena | Métricas de throttling del contenedor (cgroup `cpu.stat`) |\n\n## ResourceQuota y LimitRange\n\n| Objeto | Qué hace |\n|---|---|\n| ResourceQuota | Tope total del namespace: número de Pods, suma de requests y limits… |\n| LimitRange | Valores por defecto y mínimos/máximos por contenedor en el namespace |\n\n```bash\nkubectl get quota,limitrange -n <ns>\nkubectl describe quota -n <ns>              # Used frente a Hard\nkubectl edit resourcequota <nombre> -n <ns>\n```\n\nSi una cuota impide crear Pods, no verás Pods en error: el ReplicaSet registra `FailedCreate … exceeded quota` en los eventos (`kubectl get events -n <ns>`).\n\n## HPA: escalar Pods\n\n```bash\nkubectl autoscale deployment <app> --min=1 --max=5 --cpu-percent=60 -n <ns>\nkubectl get hpa -n <ns> -w\nkubectl describe hpa <app> -n <ns>\n```\n\nFórmula (documentación oficial):\n\n```text\nréplicas deseadas = ceil( réplicas actuales × valor actual / valor objetivo )\nejemplo: 2 réplicas al 90 % con objetivo 60 % → ceil(2 × 90 / 60) = 3\n```\n\nRequisitos:\n\n- metrics-server instalado (`kubectl top pods` funciona).\n- `requests.cpu` en el Deployment: el porcentaje es uso / request. Sin request, TARGETS sale `<unknown>`.\n- Tiempo: unos minutos hasta tener métricas y para que estabilice.\n\n## Escalar nodos\n\n| Forma | Cómo | Cuándo |\n|---|---|---|\n| Node group a mano | `aws eks update-nodegroup-config … --scaling-config desiredSize=N` | Laboratorio o cambios puntuales |\n| Cluster Autoscaler | Sube o baja el ASG del node group cuando hay Pods Pending | Clásico, con node groups |\n| Karpenter | Crea las EC2 que hagan falta, del tamaño justo, sin node groups | Lo moderno en EKS (capítulo 09 del curso) |\n\n`desiredSize` tiene que quedar entre `minSize` y `maxSize`: para pasar de 2 a 3 nodos, sube también `maxSize`. Comandos en CHULETA-AWS-EKS.\n\n## Taints y tolerations\n\nUn taint en el nodo repele Pods. Una toleration en el Pod le deja entrar.\n\n```bash\nkubectl taint nodes <nodo> dedicado=gpu:NoSchedule        # poner\nkubectl taint nodes <nodo> dedicado-                      # quitar (todas las variantes de esa clave)\nkubectl taint nodes --all dedicado-                       # quitar de todos\nkubectl describe node <nodo> | grep Taints\n```\n\n| Efecto | Qué hace |\n|---|---|\n| `NoSchedule` | No entran Pods nuevos sin toleration; los que hay se quedan |\n| `PreferNoSchedule` | Lo evita si puede |\n| `NoExecute` | Además expulsa a los que ya estaban sin toleration |\n\nToleration en el Pod (dentro de `spec.template.spec`):\n\n```yaml\ntolerations:\n- key: dedicado\n  operator: Equal\n  value: gpu\n  effect: NoSchedule\n```\n\n## nodeSelector y labels de nodo\n\n```bash\nkubectl get nodes --show-labels\nkubectl get nodes -L topology.kubernetes.io/zone,node.kubernetes.io/instance-type\nkubectl label node <nodo> disco=ssd\nkubectl label node <nodo> disco-                  # quitar\n```\n\n`nodeSelector: {disco: ssd}` en el Pod = solo nodos con esa label. En EKS, las labels fijas se ponen en el node group o en el NodePool de Karpenter, porque un nodo nuevo no hereda las que pusiste a mano.\n\n## cordon, drain y uncordon\n\n```bash\nkubectl cordon <nodo>                                            # no entran Pods nuevos\nkubectl drain <nodo> --ignore-daemonsets --delete-emptydir-data  # cordon + desalojar\nkubectl drain <nodo> --ignore-daemonsets --delete-emptydir-data --timeout=120s\nkubectl uncordon <nodo>                                          # vuelve a servicio\n```\n\n- `--ignore-daemonsets`: los Pods de DaemonSet no se mueven (volverían al mismo nodo).\n- `--delete-emptydir-data`: acepta perder los datos de volúmenes `emptyDir`.\n- Los Pods sueltos (sin Deployment) no se recrean en otro sitio: drain se niega salvo con `--force`.\n\n## PodDisruptionBudget (PDB)\n\nLimita cuántos Pods de una aplicación pueden caer a la vez en desalojos voluntarios: drain, actualizaciones de nodos, consolidación de Karpenter.\n\n```bash\nkubectl create pdb <nombre> --selector=app=<app> --min-available=1 -n <ns>\nkubectl get pdb -n <ns>          # mira ALLOWED DISRUPTIONS\n```\n\n| Configuración | Con 2 réplicas | ALLOWED DISRUPTIONS |\n|---|---|---|\n| `minAvailable: 1` | Puede caer 1 | 1 |\n| `minAvailable: 2` | No puede caer ninguna | 0: bloquea cualquier drain |\n| `maxUnavailable: 1` | Puede caer 1 | 1 |\n\nSi ALLOWED DISRUPTIONS es 0, el drain se queda reintentando (`Cannot evict pod as it would violate the pod's disruption budget`). Arreglo sin tocar el PDB: más réplicas, para que sobre alguna.\n\n## DaemonSets: un Pod en cada nodo\n\n```bash\nkubectl get ds -A\n#   columnas: DESIRED = en cuántos nodos debe haber uno · READY = cuántos funcionan\nkubectl get pods -n kube-system -o wide | grep aws-node\n```\n\nEn EKS, `aws-node` (red, VPC CNI) y `kube-proxy` (reglas de Services) son DaemonSets: hay uno por nodo, y al añadir un nodo aparecen solos. También cuentan para el máximo de Pods del nodo.\n", "CHULETA-COMANDOS.md": "# Chuleta de comandos: kubectl y EKS\n\nÁbrela al lado de la terminal mientras juegas.\n\n- `<algo>` significa \"pon aquí tu valor\": no escribas los `< >`.\n- `-n <namespace>` indica en qué \"carpeta\" (namespace) trabajas. En el juego es `-n nivel-2`, `-n nivel-3`…\n- Sin `-n`, kubectl usa el namespace `default`.\n- Los ejemplos son para bash (Linux, macOS, WSL o Git Bash). En PowerShell las comillas simples funcionan distinto.\n\n## ⭐ Lo primero: tres palabras que salen en todo\n\n| Palabra | Qué es | Ejemplo |\n|---|---|---|\n| **`-n <ns>`** | **namespace** = \"carpeta\" del cluster donde trabajas. Si no lo pones, va a `default` | `-n nivel-2` → \"dentro de la carpeta nivel-2\" |\n| **Deployment** | \"Quiero N copias de esta imagen funcionando siempre\" (si una muere, se repone) | `kubectl create deployment web --image=nginx:1.27-alpine --replicas=3 -n nivel-2` |\n| **Service** | Dirección fija delante de esas copias. **Aquí va el PUERTO** (`--port`) | `kubectl expose deployment web --port=80 -n nivel-2` |\n\n¿Y el puerto en el Deployment? No hace falta: nginx ya escucha en el 80 por dentro. El puerto se le dice al Service (`expose --port=80`), que es quien recibe las peticiones y las reparte.\n\n## 🔎 ¿Problema con…? Índice por recurso\n\nBusca el recurso que falla y ve a la sección. Los números son los de esta chuleta (1 Mirar · 2 Crear · 3 Cambiar · 4 Dentro de los Pods · 5 Borrar · 6 Nodos · 7 Diagnosticar).\n\n| Problema con… | Crearlo | Cambiarlo o arreglarlo | Mirarlo |\n|---|---|---|---|\n| **Deployment** (imagen, réplicas, variables, recursos, comando, sondas) | 2 · `create deployment` · YAML (CHULETA-YAML) | 3 · `set image` · `set env` · `set resources` · `scale` · `edit` · `patch` | 1 · `get deploy` · `describe deploy` |\n| **Pod** que no arranca o se reinicia | Lo crea su Deployment | Se arregla en su **Deployment** (3) · `delete pod` lo recrea (5) | 1 · `describe pod` · `logs` · `logs --previous` · tabla de 7 |\n| **Service** (no llega el tráfico, puertos, selector, IP pública) | 2 · `expose` (`--port`, `--target-port`, `--type`) | 3 · `set selector` · `edit svc` · `patch svc` | 1 · `get svc -o wide` · `get endpoints` · `describe svc` · CHULETA-RED |\n| **DNS** (los nombres no resuelven) | — | CoreDNS es un Deployment de `kube-system`: se arregla como cualquier Deployment (3) | 4 · `run … nslookup` · CHULETA-RED |\n| **ConfigMap / Secret** | 2 · `create configmap` · `create secret generic` | 3 · `edit configmap` (y `rollout restart`) | 4 · Leer un Secret |\n| **Versiones** (la nueva falla, volver atrás) | — | 3 · `rollout undo` · `rollout restart` | 3 · `rollout status` · `rollout history` |\n| **Job / CronJob** | 2 · `create job` · `create cronjob` | Se borran (5) y se vuelven a crear | 1 · `get jobs` · `logs job/<nombre>` |\n| **Escalado y cuotas** (HPA, ResourceQuota, PDB) | 2 · `autoscale` · `create quota` · `create pdb` | 3 · `set resources` · `edit` · `patch` · `scale` | 1 · `get hpa` · `describe quota` · `get pdb` · CHULETA-CAPACIDAD |\n| **Nodos** (no cabe, taints, labels, mantenimiento, nodo caído, más nodos) | 6 · node group | 3 · `label node` · `taint` · 6 · `cordon` · `drain` · `uncordon` · node group | 6 · `get nodes` · `describe node` · CHULETA-AWS-EKS |\n| **Permisos** (`Forbidden`, RBAC, ServiceAccounts) | 2 · `create serviceaccount` · `role` · `rolebinding` · `clusterrole` · `clusterrolebinding` | 5 · borrar el que sobra · 2 · crear el correcto · 3 · `edit` | 1 · `auth can-i` · CHULETA-SEGURIDAD |\n| **Seguridad del Pod** (Pod Security, root, capabilities) | YAML «restricted» en CHULETA-YAML | `apply -f -` con el securityContext (2) · 3 · `label namespace` | 1 · `get events` (*FailedCreate*) · CHULETA-SEGURIDAD |\n| **Red entre Pods** (NetworkPolicy) | YAML en CHULETA-YAML y CHULETA-RED | `apply -f -` (2) · `delete netpol` (5) | 1 · `get netpol` · `describe netpol` |\n| **Pod con varios contenedores** (READY 1/2, sidecars, logs de uno) | YAML: otro elemento en `containers:` (CHULETA-BAJO-EL-CAPO) | 3 · `edit` · `set env -c <contenedor>` | 1 · `logs -c` · `--all-containers` · 4 · `exec -c` |\n| **El nodo por dentro** (PID de un contenedor, cgroup, reglas de kube-proxy, kubelet) | — | 6 · `systemctl start kubelet` | `kubectl debug node/<nodo>` · `crictl ps/inspect` · `iptables-save` · CHULETA-BAJO-EL-CAPO |\n| **Dentro del contenedor** (procesos, cgroups, token, imagen sin shell, init containers) | — | Lo que encuentres se arregla en 2 o 3 | 4 · `exec` · `debug` · 1 · `logs -c` · CHULETA-BAJO-EL-CAPO |\n| **AWS** (cuenta, versión del cluster, node group, credenciales de AWS para un Pod) | Pod Identity: CHULETA-BAJO-EL-CAPO | 6 · node group | `aws sts get-caller-identity` · `aws eks describe-cluster` · CHULETA-AWS-EKS |\n\n## 0. Antes de nada: ¿dónde estoy?\n\n| Quiero… | Comando |\n|---|---|\n| Ver con qué cuenta AWS estoy | `aws sts get-caller-identity` |\n| Renovar la sesión AWS (si sale *Unauthorized* o *expired*) | `aws sso login --profile <tu-perfil>` |\n| Ver a qué cluster apunta kubectl | `kubectl config current-context` |\n| Ver todos los clusters que conozco | `kubectl config get-contexts` |\n| Cambiar al cluster del juego | `kubectl config use-context eks-juego` |\n| Conectar kubectl al cluster (primera vez) | `aws eks update-kubeconfig --name eks-juego --alias eks-juego --profile <tu-perfil> --region eu-west-1` |\n| Dejar un namespace por defecto (ya no hace falta `-n`) | `kubectl config set-context --current --namespace=<ns>` |\n\n## 1. MIRAR (no rompe nada, úsalos sin miedo)\n\n### `get`: lista rápida\n\n```bash\nkubectl get nodes                      # nodos (las EC2)\nkubectl get nodes -o wide              # + IPs, sistema operativo, versión\nkubectl get pods -n <ns>               # pods de un namespace\nkubectl get pods -A                    # pods de TODOS los namespaces\nkubectl get pods -n <ns> -o wide       # + en qué nodo está cada pod y su IP\nkubectl get pods -n <ns> --show-labels # + sus etiquetas (labels)\nkubectl get deploy -n <ns>             # deployments\nkubectl get rs -n <ns>                 # replicasets (uno por versión del deployment)\nkubectl get svc -n <ns>                # services\nkubectl get svc -n <ns> -o wide        # + el SELECTOR del service (a qué pods apunta)\nkubectl get endpoints -n <ns>          # a qué IPs de pods manda tráfico cada service\nkubectl get cm,secret -n <ns>          # configmaps y secrets (varios tipos separados por coma)\nkubectl get hpa,pdb,quota -n <ns>      # autoescaladores, PDB y cuotas\nkubectl get job,cronjob -n <ns>        # tareas\nkubectl get ds -n kube-system          # daemonsets (un Pod por nodo)\nkubectl get ns                         # namespaces\nkubectl get all -n <ns>                # casi todo de golpe\nkubectl get pods -n <ns> -w            # \"en vivo\": se actualiza solo (salir: Ctrl+C)\n```\n\n**Cómo leer `kubectl get pods`:**\n\n```text\nNAME                   READY   STATUS             RESTARTS   AGE\nweb-7d4b9c-x2kfp       1/1     Running            0          2m    ← bien\napi-5f6c8d-abcde       0/1     ImagePullBackOff   0          1m    ← no puede descargar la imagen\napp-6b7c9d-fghij       0/1     CrashLoopBackOff   5          3m    ← arranca y muere una y otra vez\ngigante-8c9d-klmno     0/1     Pending            0          1m    ← no cabe en ningún nodo\n```\n\n- `READY 1/1`: contenedores listos / total.\n- `RESTARTS` subiendo sin parar: algo lo mata, y conviene mirar `logs --previous`.\n\n### Filtrar, columnas extra y contar\n\n```bash\nkubectl get pods -n <ns> -l app=web                # solo los que tienen esa label (-l = --selector)\nkubectl get pods -n <ns> -l 'tier=backend,app!=web'\nkubectl get nodes -L topology.kubernetes.io/zone   # añade una label como columna (-L)\nkubectl get pods -n <ns> --no-headers | wc -l      # contar (sin la línea de cabecera)\nkubectl get pods -A | grep -v Running              # lo que NO está Running\n```\n\n### Ver el objeto entero o un campo concreto\n\n```bash\nkubectl get deploy <nombre> -n <ns> -o yaml                      # todo el objeto en YAML\nkubectl get pod <pod> -n <ns> -o jsonpath='{.status.qosClass}'   # un solo campo\nkubectl get nodes -o jsonpath='{.items[*].metadata.name}'        # un campo de cada elemento\nkubectl get pods -n <ns> -o name                                 # solo nombres: pod/xxx\n```\n\nEl jsonpath empieza siempre por `{.` y sigue la estructura del YAML: `{.spec.replicas}`, `{.data.clave}`.\n\n### `describe`: el detalle y **el porqué**\n\n```bash\nkubectl describe pod <pod> -n <ns>       # ⭐ EL MÁS ÚTIL: lee \"Events\" al final\nkubectl describe deploy <nombre> -n <ns> # Conditions: ReplicaFailure si no puede crear Pods\nkubectl describe rs <nombre> -n <ns>     # Events del ReplicaSet: FailedCreate (cuota, PodSecurity)\nkubectl describe svc <nombre> -n <ns>    # mira \"Selector\", \"TargetPort\" y \"Endpoints\"\nkubectl describe node <nodo>             # capacidad, allocatable, taints, pods del nodo\nkubectl describe hpa <nombre> -n <ns>    # por qué no mide\n```\n\n### `logs`: lo que escribe la aplicación\n\n```bash\nkubectl logs <pod> -n <ns>               # salida del contenedor\nkubectl logs <pod> -n <ns> --previous    # ⭐ la del contenedor ANTERIOR (el que murió)\nkubectl logs <pod> -n <ns> -f            # seguir en vivo (Ctrl+C para salir)\nkubectl logs deploy/<nombre> -n <ns>     # de un pod cualquiera del deployment\nkubectl logs job/<nombre> -n <ns>        # salida de un Job\nkubectl logs <pod> -n <ns> -c <contenedor>   # un contenedor concreto (también los init containers)\n```\n\n### Eventos y consumo\n\n```bash\nkubectl get events -n <ns> --sort-by=.lastTimestamp   # qué ha pasado, en orden\nkubectl events -n <ns> --types=Warning                # solo avisos (comando más nuevo)\nkubectl events -n <ns> --for pod/<pod>                # los de un objeto\nkubectl top nodes                                     # CPU/RAM de los nodos (necesita metrics-server)\nkubectl top pods -n <ns>                              # CPU/RAM de los pods\n```\n\n### Permisos: ¿puedo hacer esto?\n\n```bash\nkubectl auth can-i create deployments -n <ns>                                  # yo\nkubectl auth can-i list pods -n <ns> --as=system:serviceaccount:<ns>:<sa>      # otra identidad\nkubectl auth can-i --list -n <ns>                                              # todo lo que puedo\nkubectl auth can-i list pods -A --as=system:serviceaccount:<ns>:<sa>           # en TODOS los namespaces\n```\n\n## 2. CREAR\n\n```bash\n# Un Deployment (N copias de una imagen que se reponen solas)\nkubectl create deployment <nombre> --image=<imagen:tag> --replicas=<N> -n <ns>\n#   ej: kubectl create deployment hola --image=nginx:1.27-alpine --replicas=2 -n pruebas\n\n# Un Service delante de un deployment (dirección fija + reparte tráfico)  ← AQUÍ VA EL PUERTO\n#   --port = puerto en el que escucha el Service (para nginx: 80)\n#   el Service se llama igual que el deployment salvo que pongas --name=<otro>\nkubectl expose deployment <nombre> --port=<puerto> -n <ns>                     # interno (ClusterIP)\nkubectl expose deployment <nombre> --port=80 --target-port=8080 -n <ns>        # si el contenedor escucha en otro puerto\nkubectl expose deployment <nombre> --port=80 --type=LoadBalancer -n <ns>       # público: AWS crea un balanceador\nkubectl expose deployment <nombre> --name=<svc> --port=80 --target-port=<puerto|nombre-del-puerto> --type=NodePort -n <ns>   # abre un puerto 30000-32767 en cada nodo\n\n# Configuración y secretos\nkubectl create configmap <nombre> --from-literal=<CLAVE>=<valor> -n <ns>\nkubectl create secret generic <nombre> --from-literal=<clave>=<valor> -n <ns>\n\n# Un namespace\nkubectl create namespace <ns>\n\n# Una tarea que termina (Job) y una tarea programada (CronJob). El comando va detrás de --\nkubectl create job <nombre> --image=busybox:1.37 -n <ns> -- echo hola\nkubectl create cronjob <nombre> --image=busybox:1.37 --schedule=\"*/15 * * * *\" -n <ns> -- date\n\n# Un autoescalador (HPA)\nkubectl autoscale deployment <nombre> --min=<n> --max=<n> --cpu-percent=<porcentaje> -n <ns>\n#   cualquier kubectl: --cpu-percent=50   ·   los recientes (1.36) admiten también --cpu=50%\n\n# Límites del namespace\nkubectl create quota <nombre> --hard=pods=10,requests.cpu=2 -n <ns>\nkubectl create pdb <nombre> --selector=app=<app> --min-available=1 -n <ns>\n\n# Permisos (RBAC)\nkubectl create serviceaccount <sa> -n <ns>\nkubectl create role <rol> --verb=get,list,watch --resource=pods -n <ns>\nkubectl create rolebinding <nombre> --role=<rol> --serviceaccount=<ns>:<sa> -n <ns>\nkubectl create rolebinding <nombre> --clusterrole=view --serviceaccount=<ns>:<sa> -n <ns>\nkubectl create clusterrole <rol> --verb=get,list,watch --resource=pods                        # como un Role, pero sin namespace\nkubectl create clusterrolebinding <nombre> --clusterrole=<rol> --serviceaccount=<ns>:<sa>     # vale en TODOS los namespaces\n```\n\n### Crear desde YAML sin fichero (`apply -f -` con heredoc)\n\n```bash\nkubectl apply -f - <<'FIN'\napiVersion: v1\nkind: ConfigMap\nmetadata:\n  name: ejemplo\n  namespace: pruebas\ndata:\n  CLAVE: \"valor\"\nFIN\n```\n\n`apply` crea si no existe y actualiza si existe. Plantillas de cada tipo: CHULETA-YAML.\n\n¿No recuerdas los flags? `kubectl create deployment --help` y `kubectl expose --help`: al final traen ejemplos.\n\n## 3. CAMBIAR\n\n```bash\n# Cambiar la imagen. El nombre del contenedor sale en \"describe deploy\"\n#   (con \"kubectl create deployment\" se llama como el nombre de la imagen: nginx, busybox…)\nkubectl set image deployment/<nombre> <contenedor>=<imagen:tag> -n <ns>\n\n# Cambiar recursos (CPU en \"m\" = milésimas: 100m = 0,1 CPU · memoria en Mi/Gi)\nkubectl set resources deployment <nombre> --requests=cpu=100m,memory=64Mi -n <ns>\nkubectl set resources deployment <nombre> --limits=memory=256Mi -n <ns>\n\n# Variables de entorno\nkubectl set env deployment/<nombre> CLAVE=valor -n <ns>      # añadir o cambiar\nkubectl set env deployment/<nombre> CLAVE- -n <ns>           # quitar (el - final)\nkubectl set env deployment/<nombre> --list -n <ns>           # ver las que tiene\nkubectl set env deployment/<nombre> -c <contenedor> CLAVE=valor -n <ns>   # en un contenedor concreto (sin -c: el primero)\n\n# Cambiar a qué pods apunta un Service\nkubectl set selector service <nombre> <clave>=<valor> -n <ns>\n\n# Número de copias\nkubectl scale deployment <nombre> --replicas=<N> -n <ns>\n\n# Labels y taints de nodos\nkubectl label node <nodo> clave=valor                         # poner\nkubectl label node <nodo> clave=otro --overwrite              # cambiar una que ya existe\nkubectl label node <nodo> clave-                              # quitar\nkubectl taint nodes <nodo> clave=valor:NoSchedule             # repeler Pods\nkubectl taint nodes <nodo> clave-                             # quitar el taint\nkubectl taint nodes --all clave-                              # quitarlo de todos los nodos\n\n# Labels de un namespace (p. ej. su nivel de Pod Security)\nkubectl label namespace <ns> clave=valor --overwrite\n\n# Editar cualquier cosa a mano (abre un editor con el YAML; guardar = aplicar)\nkubectl edit deployment <nombre> -n <ns>        # imagen, command, sondas, recursos, tolerations, securityContext…\nkubectl edit svc <nombre> -n <ns>               # selector, port, targetPort, type\nkubectl edit configmap <nombre> -n <ns>         # ⚠️ si los Pods lo leen como variables, no lo ven hasta un  rollout restart\nkubectl edit resourcequota <nombre> -n <ns>     # cuotas del namespace\nkubectl edit serviceaccount <sa> -n <ns>        # la identidad de los Pods\nkubectl edit <tipo> <nombre> -n <ns>            # vale para cualquier objeto: hpa, pdb, netpol, role…\n#   en Linux suele abrir vi: \"i\" para escribir, Esc y \":wq\" para guardar y salir, \":q!\" para salir sin guardar\n#   para usar nano:  export KUBE_EDITOR=nano\n```\n\n### `patch`: cambiar un campo sin editor\n\n```bash\n# merge: escribes solo la parte del objeto que cambia\nkubectl patch deployment <nombre> -n <ns> --type=merge -p '{\"spec\":{\"replicas\":3}}'\n\n# json: operaciones exactas sobre una ruta (útil en listas)\nkubectl patch deployment <nombre> -n <ns> --type=json \\\n  -p '[{\"op\":\"replace\",\"path\":\"/spec/template/spec/containers/0/image\",\"value\":\"nginx:1.27-alpine\"}]'\n#   otras rutas («0» = el primer contenedor de la lista; \"value\" = lo que quieras poner):\n#     /spec/template/spec/containers/0/command\n#     /spec/template/spec/containers/0/args\n#     /spec/template/spec/containers/0/ports      (con \"op\":\"add\" si el contenedor aún no declara puertos)\n#     /spec/template/spec/containers/0/readinessProbe/httpGet/path   (o …/port)\n#     /spec/template/spec/containers/0/livenessProbe/httpGet/path    (o …/port)\n#   \"op\": \"replace\" cambia un campo que existe · \"add\" lo crea · \"remove\" lo borra (sin \"value\")\n\n# otros objetos, con merge\nkubectl patch svc <nombre> -n <ns> -p '{\"spec\":{\"ports\":[{\"port\":<puerto>,\"targetPort\":<puerto-del-contenedor>}]}}'\nkubectl patch resourcequota <nombre> -n <ns> -p '{\"spec\":{\"hard\":{\"pods\":\"<N>\"}}}'\n```\n\nComillas simples por fuera y dobles por dentro. Sin `--type`, kubectl usa `strategic` (parecido a merge, pero sabe fusionar listas como `containers` por nombre).\n\n### Versiones de un deployment (rollout)\n\n```bash\nkubectl rollout status  deployment/<nombre> -n <ns>                  # espera a que termine\nkubectl rollout history deployment/<nombre> -n <ns>                  # revisiones\nkubectl rollout history deployment/<nombre> -n <ns> --revision=2     # detalle de una\nkubectl rollout undo    deployment/<nombre> -n <ns>                  # vuelve a la anterior\nkubectl rollout undo    deployment/<nombre> -n <ns> --to-revision=1  # vuelve a una concreta\nkubectl rollout restart deployment/<nombre> -n <ns>                  # recrea los Pods (relee ConfigMaps en env)\nkubectl rollout pause   deployment/<nombre> -n <ns>                  # congelar cambios\nkubectl rollout resume  deployment/<nombre> -n <ns>                  # reanudar\n```\n\n## 4. DENTRO DE LOS PODS\n\n```bash\n# Ejecutar un comando dentro de un contenedor que ya corre (el comando va tras --)\nkubectl exec <pod> -n <ns> -- env\nkubectl exec deploy/<nombre> -n <ns> -- cat /etc/resolv.conf\nkubectl exec -it <pod> -n <ns> -- sh                  # shell interactiva (exit para salir)\n\n# Pod de usar y tirar para probar red/DNS desde dentro (--rm lo borra al salir)\nkubectl run prueba --rm -it --image=busybox:1.37 -n <ns> -- nslookup <servicio>\nkubectl run prueba --rm -it --image=busybox:1.37 -n <ns> -- wget -qO- -T 3 http://<servicio>\n\n# Túnel desde tu PC a un Service o Pod (se queda abierto hasta Ctrl+C)\nkubectl port-forward svc/<servicio> 8080:80 -n <ns>   # luego, en OTRA terminal: curl http://localhost:8080\n\n# Imagen sin shell (exec no sirve): contenedor efímero de depuración dentro del Pod\nkubectl debug -it <pod> -n <ns> --image=busybox:1.37 --target=<contenedor>\nkubectl debug node/<nodo> -it --image=busybox:1.37    # depurar un nodo\n#   qué mirar dentro (PID 1, cgroups, capabilities, token): CHULETA-BAJO-EL-CAPO\n```\n\n`busybox` trae `wget`, `nslookup` y `sh`, pero no `curl`.\n\n### Leer un Secret (base64 NO es cifrado)\n\n```bash\nkubectl get secret <nombre> -n <ns> -o jsonpath='{.data.<clave>}' | base64 -d\necho 'aG9sYQ==' | base64 -d          # decodificar a mano → hola\necho -n 'hola' | base64              # codificar (-n: sin salto de línea al final)\n```\n\n## 5. BORRAR\n\n```bash\nkubectl delete pod <pod> -n <ns>                 # su deployment crea otro (útil para \"reiniciar\")\nkubectl delete deployment <nombre> -n <ns>\nkubectl delete svc <nombre> -n <ns>              # ⚠️ si era LoadBalancer, borra el balanceador de AWS\nkubectl delete cm <nombre> -n <ns>\nkubectl delete rolebinding <nombre> -n <ns>\nkubectl delete <tipo> <nombre> -n <ns>           # cualquier otro: secret, job, hpa, quota, netpol, role…\nkubectl delete clusterrolebinding <nombre>       # los de cluster van sin -n\nkubectl delete namespace <ns>                    # ⚠️ borra TODO lo que hay dentro\n```\n\n## 6. NODOS\n\n```bash\nkubectl get nodes\nkubectl describe node <nodo>\nkubectl cordon <nodo>        # \"no metas más pods aquí\" (los que hay siguen)\nkubectl uncordon <nodo>      # deshacer el cordon\nkubectl drain <nodo> --ignore-daemonsets --delete-emptydir-data                  # cordon + sacar sus pods a otro nodo\nkubectl drain <nodo> --ignore-daemonsets --delete-emptydir-data --timeout=120s   # que no espere para siempre\n```\n\n### Node group (las EC2 que gestiona EKS) con la AWS CLI\n\n```bash\naws eks describe-nodegroup --cluster-name eks-juego --nodegroup-name ng-juego \\\n  --query 'nodegroup.[status,scalingConfig]'\n\n# Cambiar el número de nodos (desiredSize debe estar entre minSize y maxSize)\naws eks update-nodegroup-config --cluster-name eks-juego --nodegroup-name ng-juego \\\n  --scaling-config minSize=1,maxSize=2,desiredSize=<N>\n```\n\n### Entrar dentro del nodo (sin SSH)\n\n```bash\naws ec2 describe-instances --filters Name=tag:eks:nodegroup-name,Values=ng-juego Name=instance-state-name,Values=running \\\n  --query 'Reservations[].Instances[].InstanceId' --output text\naws ssm start-session --target <instance-id>\n#   dentro:  sudo systemctl status kubelet  ·  sudo journalctl -u kubelet -n 50  ·  sudo crictl ps  ·  exit\n```\n\nMás comandos de AWS: CHULETA-AWS-EKS.\n\n## 7. Diagnosticar: qué significa cada STATUS y qué mirar\n\n| STATUS / síntoma | Qué pasa | Qué miro primero | Se arregla en |\n|---|---|---|---|\n| `Pending` | No cabe en ningún nodo (falta CPU o memoria, taints, nodeSelector, nodos cordoned) | `describe pod` → Events: *Insufficient cpu*, *untolerated taint* | 3 (`set resources`, labels, taints) · 6 (node group, `uncordon`) |\n| `ErrImagePull` / `ImagePullBackOff` | No puede descargar la imagen (nombre o tag mal, o repo privado) | `describe pod` → Events: *not found* | 3 (`set image`, `edit`) |\n| `CreateContainerConfigError` | Le falta un ConfigMap o Secret que usa | `describe pod` → Events: *configmap \"x\" not found* | 2 (crear lo que falta) |\n| `CrashLoopBackOff` | Arranca y muere en bucle | `logs --previous` y `describe pod` → *Last State* | 3 (`set env`, `edit`, `patch`) |\n| `OOMKilled` (Exit Code 137) | Usó más memoria que su `limits` y el kernel lo mató | `describe pod` → *Limits* vs lo que necesita | 3 (`set resources`) |\n| `StartError` / `RunContainerError` | El comando del contenedor no existe o no se puede lanzar | `describe pod` → *executable file not found* | 3 (`edit`, `patch` del command) |\n| `Running` pero `0/1` | Vive, pero no pasa la *readiness probe*, así que no recibe tráfico | `describe pod` → *Readiness probe failed…* | 3 (`edit`, `patch` de la sonda) |\n| `RESTARTS` que suben con el Pod `Running` | Falla la *liveness probe* y el kubelet lo reinicia | `describe pod` → *Liveness probe failed…* | 3 (`edit`, `patch` de la sonda) |\n| `READY 1/2` (Pod con varios contenedores) | Uno de los contenedores no está listo o se reinicia | `describe pod` → el bloque de cada contenedor · `logs -c <contenedor>` | 3 (`edit`, `set env -c`) |\n| `Init:0/1` · `Init:CrashLoopBackOff` | Un init container no termina: espera algo o falla | `logs <pod> -c <init>` · `describe pod` → *Init Containers* | Lo que espere: 2 (crear el Service, el Secret…) |\n| Menos Pods de los que pide el Deployment | El ReplicaSet no puede crearlos (cuota, PodSecurity) | `get events` → *FailedCreate* | 3 (`edit` la cuota) · CHULETA-SEGURIDAD |\n| La versión nueva no termina de desplegarse | Los Pods nuevos fallan; los viejos siguen | `rollout status` · `get pods` | 3 (`rollout undo`) |\n| Service sin endpoints | El *selector* del Service no casa con las *labels* de los pods | `get svc -o wide` vs `get pods --show-labels` | 3 (`set selector`, `edit svc`) |\n| Service con endpoints que no responde | `targetPort` distinto del puerto del contenedor, o NetworkPolicy | `describe svc` → *TargetPort* | 3 (`edit svc`, `patch svc`) · CHULETA-RED |\n| Service LoadBalancer en `<pending>` | AWS aún lo crea (2-4 min) o no puede | `describe svc` → Events | Esperar, o 2 (`expose --type=LoadBalancer`) |\n| No llega a un Service de OTRO namespace | Los nombres cortos solo valen en el mismo namespace | `nslookup <servicio>.<namespace>` | Usa `<servicio>.<namespace>` · 3 (`set env`) |\n| Nada resuelve nombres (DNS) | CoreDNS caído | `get deploy -n kube-system` → `coredns` | 3: es un Deployment más |\n| HPA con TARGETS `<unknown>` | Los Pods no tienen `requests.cpu` (o falta metrics-server) | `describe hpa` | 3 (`set resources --requests`) |\n| `drain` que no acaba | Un PodDisruptionBudget no permite sacar más Pods | `get pdb` → ALLOWED DISRUPTIONS | 3 (`scale`) · CHULETA-CAPACIDAD |\n| Nodo `NotReady` | El kubelet o la instancia han caído | `describe node` → Conditions | 6 · CHULETA-AWS-EKS |\n| `Unauthorized` en kubectl | Sesión AWS caducada o contexto equivocado | `aws sts get-caller-identity`, `aws sso login …` | 0 (contexto) |\n| `Forbidden` | Estás autenticado pero RBAC no te deja | `kubectl auth can-i …` | 2 (role, rolebinding) · 5 (el que sobra) |\n\nEl detalle de cada caso, con el mensaje exacto, está en CHULETA-DIAGNOSTICO.\n\n### El método de 4 pasos (sirve para el 90 % de los fallos)\n\n```text\n1. kubectl get pods -n <ns>                 → ¿qué STATUS tiene?\n2. kubectl describe pod <pod> -n <ns>       → lee los EVENTS del final\n3. kubectl logs <pod> -n <ns> [--previous]  → ¿qué dice la aplicación?\n4. Si el pod está bien pero no llega tráfico → describe svc / get endpoints\n```\n\n## 8. Trucos que ahorran tiempo\n\n```bash\nalias k=kubectl                                    # luego: k get pods -A\nkubectl config set-context --current --namespace=nivel-2   # deja nivel-2 por defecto (ya no hace falta -n)\nkubectl explain deployment.spec.replicas           # documentación de cualquier campo\nkubectl explain deployment.spec.template.spec.containers.livenessProbe\nkubectl api-resources                              # todos los tipos de objeto y sus abreviaturas\nkubectl create deployment x --image=nginx --dry-run=client -o yaml   # genera el YAML sin crear nada\n```\n\nAbreviaturas: `po` = pods · `deploy` = deployments · `rs` = replicasets · `svc` = services · `cm` = configmaps · `ns` = namespaces · `no` = nodes · `ep` = endpoints · `ds` = daemonsets · `sa` = serviceaccounts · `quota` = resourcequotas · `pdb` = poddisruptionbudgets · `netpol` = networkpolicies.\n\n### Atajos (alias) habituales\n\nSon los del plugin `kubectl` de oh-my-zsh y de kubectl-aliases; el juego los trae puestos (escribe `alias` para verlos todos). En tu PC: `alias k=kubectl` en el `~/.bashrc`, o el plugin.\n\n| Atajo | Es | Atajo | Es |\n|---|---|---|---|\n| `k` | `kubectl` | `kd` | `kubectl describe` |\n| `kg` | `kubectl get` | `kdp` · `kdd` · `kds` · `kdn` | `describe` pods · deployment · svc · node |\n| `kgp` · `kgpw` · `kgpa` | `get pods` · `-o wide` · `--all-namespaces` | `kl` · `klf` · `klp` | `logs` · `logs -f` · `logs --previous` |\n| `kgd` · `kgs` · `kgn` | `get deployment` · `svc` · `nodes` | `kex` | `kubectl exec -it` |\n| `kga` · `kgaa` | `get all` · en todos los namespaces | `kaf` | `kubectl apply -f` |\n| `kgns` · `kgcm` · `kgsec` | `get namespaces` · `configmaps` · `secret` | `ke` · `ked` | `kubectl edit` · `edit deployment` |\n| `kge` | `get events --sort-by=.lastTimestamp` | `kdel` · `kdelp` · `kdeld` | `delete` · pods · deployment |\n| `ksd` | `kubectl scale deployment` | `kpf` | `kubectl port-forward` |\n| `krsd` · `krh` · `kru` · `krrd` | `rollout status` · `history` · `undo` · `restart` | `ktp` · `ktn` | `top pods` · `top nodes` |\n| `kcn <ns>` | fija el namespace (`config set-context --current --namespace`) | `kubens <ns>` · `kns` | lo mismo, con la herramienta kubens |\n\n```bash\nalias kk='kubectl get pods -o wide'      # crear el tuyo (en el juego dura la sesión)\nunalias kk                               # quitarlo\nkubens nivel-14                          # a partir de aquí no hace falta -n nivel-14\nkubens default                           # volver\n```\n\n## 9. Los comandos del juego (navegador)\n\n```text\nhelp                 # todos los comandos que entiende el simulador\nmapa                 # los 76 niveles y cuáles llevas (se desbloquean en orden)\nmision               # vuelve a enseñar la misión\npista                # una pista (−20 XP)\ncomprobar            # ¿lo he resuelto? (las misiones se comprueban solas)\nresponder 17         # niveles de pregunta\nsolucion             # la solución (el nivel queda a 0 XP)\nrepetir              # vuelve a montar el nivel desde cero\nsiguiente · anterior · nivel 23\nexperto              # abre todos los niveles (o el botón «Modo EXPERTO») · «experto off» vuelve al orden\nexportar             # copia de tu partida: fichero .json + código (o el botón 💾 Guardar)\nimportar <código>    # recupera una partida guardada, también en otro navegador (o el botón 📂 Cargar)\n```\n", "CHULETA-DIAGNOSTICO.md": "# Chuleta de diagnóstico: qué le pasa a mi Pod\n\nBusca el STATUS que ves en `kubectl get pods`, lee el mensaje típico y confirma con el comando. Los mensajes reales pueden variar algo de versión a versión; la idea clave se mantiene.\n\n## El método de 4 pasos\n\n```text\n1. kubectl get pods -n <ns>                     → ¿qué STATUS tiene?\n2. kubectl describe pod <pod> -n <ns>           → lee los Events del final\n3. kubectl logs <pod> -n <ns> [--previous]      → ¿qué dice la aplicación?\n4. Si el Pod está bien pero no llega tráfico    → describe svc / get endpoints\n```\n\nRegla de oro: si no hay Pods (ni siquiera Pending), el problema está un nivel más arriba, en el ReplicaSet. Mira `kubectl get events -n <ns>`.\n\n## Pending: no cabe en ningún nodo\n\nEl scheduler no encuentra nodo. El motivo exacto está en los Events del Pod.\n\n| Mensaje en Events | Causa | Arreglo típico |\n|---|---|---|\n| `0/1 nodes are available: 1 Insufficient cpu` | Los requests de CPU no caben | Bajar `requests.cpu` o añadir nodos |\n| `Insufficient memory` | Los requests de memoria no caben | Bajar `requests.memory` o añadir nodos |\n| `Too many pods` | El nodo llegó a su máximo de Pods (red: VPC CNI) | Más nodos, o menos réplicas |\n| `had untolerated taint {clave: valor}` | El nodo tiene un taint y el Pod no lo tolera | Quitar el taint o añadir una toleration |\n| `didn't match Pod's node affinity/selector` | `nodeSelector` o affinity sin nodo que cumpla | Etiquetar un nodo o cambiar el selector |\n| `node(s) were unschedulable` | Nodos en cordon (mantenimiento) | `kubectl uncordon` cuando acabe |\n\n```bash\nkubectl describe pod <pod> -n <ns> | tail -20\nkubectl describe node <nodo> | grep -A8 -E \"Taints|Allocatable|Allocated resources\"\nkubectl get nodes -L <label>\n```\n\n## ContainerCreating durante mucho tiempo\n\nLo normal es que dure segundos. Si se eterniza, mira los Events: suele ser un volumen que no se monta, un ConfigMap o Secret montado como volumen que no existe, o que no quedan IPs en la subnet (\"failed to assign an IP address to container\").\n\n```bash\nkubectl describe pod <pod> -n <ns> | tail -15\n```\n\n## ErrImagePull e ImagePullBackOff: la imagen no se descarga\n\n`ErrImagePull` es el fallo inmediato; `ImagePullBackOff` es Kubernetes esperando cada vez más antes de reintentar. La causa es la misma.\n\n| Mensaje en Events | Causa |\n|---|---|\n| `failed to resolve reference \"docker.io/library/nginx:9.99\": … not found` | El tag no existe |\n| `pull access denied, repository does not exist or may require authorization` | El repositorio no existe (errata en el nombre) o es privado |\n| `i/o timeout` o `dial tcp … timeout` | El nodo no sale a Internet (sin NAT ni endpoints de VPC) |\n\n```bash\nkubectl describe pod <pod> -n <ns> | grep -A3 -i image\nkubectl get deploy <nombre> -n <ns> -o jsonpath='{.spec.template.spec.containers[*].image}'\n```\n\nArreglo: `kubectl set image deployment/<nombre> <contenedor>=<imagen:tag> -n <ns>`.\n\n## CreateContainerConfigError: le falta configuración\n\nEl contenedor no se crea porque algo que usa no existe.\n\n| Mensaje en Events | Causa |\n|---|---|\n| `Error: configmap \"x\" not found` | Falta el ConfigMap |\n| `Error: secret \"x\" not found` | Falta el Secret |\n| `Error: couldn't find key K in ConfigMap ns/x` | Existe, pero no tiene esa clave |\n| `Error: container has runAsNonRoot and image will run as root` | El Pod exige no-root y la imagen corre como root |\n\n```bash\nkubectl describe pod <pod> -n <ns> | tail -10\nkubectl get cm,secret -n <ns>\n```\n\nSe arregla creando lo que falta. El Pod lo reintenta solo y arranca: no hace falta borrar nada.\n\n## CrashLoopBackOff: arranca y muere en bucle\n\nEl proceso del contenedor termina y Kubernetes lo reinicia con esperas crecientes. La clave es el Exit Code del intento anterior.\n\n```bash\nkubectl logs <pod> -n <ns> --previous              # lo que dijo antes de morir\nkubectl describe pod <pod> -n <ns> | grep -A6 \"Last State\"\n```\n\n### Tabla de exit codes\n\n| Exit Code | Significado | Dónde mirar |\n|---|---|---|\n| 0 | Terminó \"bien\"… pero un Deployment espera un proceso que no acabe | El comando del contenedor no se queda corriendo |\n| 1 | La aplicación decidió salir con error | `logs --previous`: el mensaje de la app |\n| 2 | Uso incorrecto del comando o de la shell | `logs --previous` y el comando |\n| 126 | El comando existe pero no se puede ejecutar (permisos) | El fichero o binario y sus permisos |\n| 127 | Comando no encontrado (dentro de una shell: `sh -c`) | Errata en el comando |\n| 128 | El runtime no pudo arrancar el proceso (StartError) (no comprobado en este cluster) | `describe pod` → Message |\n| 137 | Matado con SIGKILL: OOMKilled, o no paró a tiempo tras SIGTERM | `describe pod` → Reason |\n| 139 | Fallo de segmentación (SIGSEGV) | Bug de la aplicación o binario incompatible |\n| 143 | Terminado con SIGTERM (parada ordenada) | Normal al parar; raro si se repite |\n\nLos códigos mayores de 128 son 128 + número de señal: 137 = 128 + 9 (KILL), 143 = 128 + 15 (TERM).\n\n## OOMKilled: se quedó sin memoria\n\n`Last State: Terminated, Reason: OOMKilled, Exit Code: 137`. El contenedor usó más memoria que su `limits.memory` y el kernel lo mató.\n\n```bash\nkubectl describe pod <pod> -n <ns> | grep -E -A3 \"Limits|Last State\"\nkubectl top pod <pod> -n <ns>\n```\n\nArreglo: subir `limits.memory` por encima de lo que la aplicación usa de verdad, o hacer que use menos. La CPU nunca provoca OOMKilled: se estrangula (CHULETA-CAPACIDAD).\n\n## StartError o RunContainerError: ni siquiera arranca el proceso\n\nMensaje típico: `exec: \"nombre\": executable file not found in $PATH`. El `command` del contenedor apunta a algo que no existe en la imagen (errata, o imagen sin ese programa).\n\n```bash\nkubectl get deploy <nombre> -n <ns> -o jsonpath='{.spec.template.spec.containers[0].command}'\n```\n\nArreglo: corregir `command`/`args` con `kubectl edit` o `kubectl patch --type=json`.\n\n## Running pero READY 0/1: vive, pero no recibe tráfico\n\nLa readiness probe falla: el Pod sale de los endpoints del Service, pero no se reinicia.\n\n| Mensaje en Events | Causa |\n|---|---|\n| `Readiness probe failed: HTTP probe failed with statuscode: 404` | La ruta de la probe no existe |\n| `Readiness probe failed: … connection refused` | Puerto equivocado en la probe |\n| `Readiness probe failed: …` con un comando `exec` | El comando de la probe falla (por ejemplo, no llega a otro servicio) |\n\n```bash\nkubectl describe pod <pod> -n <ns> | grep -E \"Readiness|Liveness|Warning\"\n```\n\n## RESTARTS que suben con el Pod Running\n\nLa liveness probe falla y el kubelet mata el contenedor: `Liveness probe failed: … connection refused` y `Container x failed liveness probe, will be restarted`. Una liveness mal configurada (puerto, ruta o tiempos) tumba aplicaciones sanas.\n\n## Completed\n\nNormal en un Job. En un Deployment significa que el proceso terminó: el Pod pasará a CrashLoopBackOff con `Last State: Completed, Exit Code: 0`. El contenedor de un Deployment tiene que quedarse corriendo.\n\n## Terminating que no acaba\n\nCausas típicas: el nodo del Pod está caído (el kubelet no confirma), o el objeto tiene finalizers pendientes.\n\n```bash\nkubectl get pod <pod> -n <ns> -o jsonpath='{.metadata.finalizers}'\nkubectl get nodes\n```\n\nÚltimo recurso, sabiendo lo que haces: `kubectl delete pod <pod> -n <ns> --grace-period=0 --force` (no espera confirmación del nodo).\n\n## Nodo NotReady\n\nEl kubelet del nodo dejó de informar: `Kubelet stopped posting node status`, con las condiciones en `Unknown`. Por defecto, sus Pods se desalojan pasados unos 5 minutos.\n\n```bash\nkubectl get nodes\nkubectl describe node <nodo> | grep -A8 Conditions\nkubectl get node <nodo> -o jsonpath='{.spec.providerID}'    # aws:///<zona>/<instance-id>\n```\n\nEn EKS un nodo roto no se repara: se sustituye. Ver CHULETA-AWS-EKS (terminate-instances).\n\n## FailedCreate: el Deployment quiere N Pods y hay menos\n\nLos Pods ni siquiera existen. El error está en el ReplicaSet.\n\n| Mensaje | Causa |\n|---|---|\n| `exceeded quota: x, requested: pods=1, used: pods=2, limited: pods=2` | ResourceQuota del namespace |\n| `violates PodSecurity \"restricted:latest\": allowPrivilegeEscalation != false …` | Pod Security Admission del namespace |\n| `must specify limits.memory` o `requests.cpu` | Una cuota exige recursos declarados |\n\n```bash\nkubectl get events -n <ns> --sort-by=.lastTimestamp\nkubectl describe rs -n <ns> | tail -15\nkubectl describe quota -n <ns>\nkubectl get ns <ns> --show-labels\n```\n\n## Tráfico: el Service no llega\n\n| Síntoma | Causa típica | Confirmar |\n|---|---|---|\n| `kubectl get endpoints` da `<none>` | El selector del Service no casa con las labels de los Pods, o los Pods no están listos | `kubectl get svc <s> -o wide` y `kubectl get pods --show-labels` |\n| Hay endpoints pero `connection refused` | `targetPort` distinto del puerto donde escucha el contenedor | `kubectl describe svc <s>` → TargetPort |\n| Hay endpoints pero `timeout` | Una NetworkPolicy lo bloquea | `kubectl get netpol -n <ns>` |\n| `bad address` o `could not resolve host` | DNS: nombre mal, otro namespace o CoreDNS caído | Ver DNS abajo |\n\nProbar desde dentro:\n\n```bash\nkubectl run prueba --rm -it --image=busybox:1.37 -n <ns> -- wget -qO- -T 3 http://<servicio>\n```\n\n## DNS\n\n| Síntoma | Causa |\n|---|---|\n| Un nombre corto no resuelve desde otro namespace | Los nombres cortos solo valen en el mismo namespace: usa `<svc>.<ns>` |\n| Nada resuelve: `connection timed out; no servers could be reached` | CoreDNS caído o escalado a 0 |\n\n```bash\nkubectl run dns --rm -it --image=busybox:1.37 -n <ns> -- nslookup kubernetes.default\nkubectl get deploy coredns -n kube-system        # CoreDNS es un Deployment más: ¿cuántas réplicas tiene listas?\n```\n\nCoreDNS se arregla como cualquier Deployment (CHULETA-COMANDOS, 3. CAMBIAR).\n\n## HPA con TARGETS `<unknown>`\n\n| Mensaje en `describe hpa` | Causa |\n|---|---|\n| `missing request for cpu` | El Deployment no declara `requests.cpu`: sin request no hay porcentaje |\n| `unable to fetch metrics` | No hay metrics-server o aún no tiene datos (espera 1-2 min) |\n\n## drain bloqueado por un PDB\n\n`error when evicting pods/\"x\" -n \"ns\" (will retry after 5s): Cannot evict pod as it would violate the pod's disruption budget.` El drain reintenta indefinidamente.\n\n```bash\nkubectl get pdb -n <ns>          # ALLOWED DISRUPTIONS = 0 → nada se puede desalojar\n```\n\nArreglo sin tocar el PDB: más réplicas, para que sobre una. Para no esperar para siempre, usa `--timeout=120s` en el drain.\n\n## Unauthorized y Forbidden\n\n| Error | Significa | Confirmar |\n|---|---|---|\n| `You must be logged in to the server (Unauthorized)` | IAM: la credencial caducó, es de otra cuenta o no tiene access entry | `aws sts get-caller-identity`, `kubectl config current-context` |\n| `… is forbidden: User \"x\" cannot list resource \"pods\" … in the namespace \"y\"` | RBAC: estás dentro, pero sin permiso para eso | `kubectl auth can-i list pods -n y` |\n\nDetalle en CHULETA-SEGURIDAD.\n", "CHULETA-RED.md": "# Chuleta de red: Services, DNS y NetworkPolicy\n\n## Services: los cuatro tipos\n\n| Tipo | Quién llega | Para qué |\n|---|---|---|\n| ClusterIP (por defecto) | Solo desde dentro del cluster | Comunicación entre aplicaciones |\n| NodePort | Desde fuera, a `IP-del-nodo:30000-32767` | Pruebas, o detrás de un balanceador propio |\n| LoadBalancer | Desde fuera, por un balanceador de AWS | Publicar en Internet o en la VPC |\n| Headless (`clusterIP: None`) | El DNS devuelve las IPs de los Pods, sin IP virtual | StatefulSets, bases de datos con réplicas |\n\n```bash\nkubectl expose deployment <app> --port=80 -n <ns>                      # ClusterIP\nkubectl expose deployment <app> --port=80 --type=LoadBalancer -n <ns>  # LoadBalancer\nkubectl get svc -n <ns> -o wide                                        # tipo, IP, puertos, SELECTOR\n```\n\n## Los tres puertos (la confusión más típica)\n\n| Campo | Dónde | Significa |\n|---|---|---|\n| `port` | Service | Donde escucha el Service. Es el que usan los clientes: `http://<svc>:<port>` |\n| `targetPort` | Service | Donde escucha el contenedor. Si no se pone, vale lo mismo que `port` |\n| `containerPort` | Pod | Informativo: documenta el puerto, pero no abre ni cierra nada |\n\n```text\ncliente ──► Service web:80 ──► (targetPort) ──► Pod 10.20.33.15:80\n```\n\nSi `targetPort` no coincide con el puerto real del proceso, el Service tiene endpoints pero las conexiones dan `connection refused`.\n\n```bash\nkubectl describe svc <svc> -n <ns> | grep -E \"Port|TargetPort|Endpoints\"\nkubectl describe pod <pod> -n <ns> | grep -i port\n```\n\n## Endpoints y EndpointSlices\n\nSon la lista real de IPs de Pods a las que el Service manda tráfico: solo Pods **listos** (readiness OK) que cumplen el selector.\n\n```bash\nkubectl get endpoints <svc> -n <ns>                                  # API antigua, aún útil\nkubectl get endpointslices -n <ns> -l kubernetes.io/service-name=<svc>\n```\n\n| Ves | Significa |\n|---|---|\n| `<none>` | Ningún Pod cumple el selector, o ninguno está listo |\n| Menos IPs de las esperadas | Algunos Pods fallan la readiness |\n| IPs, pero no responde | `targetPort`, NetworkPolicy o la aplicación no escucha |\n\n## DNS dentro del cluster\n\n| Nombre | Desde dónde funciona |\n|---|---|\n| `<svc>` | Solo desde el mismo namespace |\n| `<svc>.<ns>` | Desde cualquier namespace |\n| `<svc>.<ns>.svc.cluster.local` | Desde cualquier sitio del cluster (nombre completo, FQDN) |\n\nEl `/etc/resolv.conf` de un Pod lo explica:\n\n```text\nsearch <ns>.svc.cluster.local svc.cluster.local cluster.local\nnameserver 172.20.0.10\noptions ndots:5\n```\n\n- `search`: los sufijos que se prueban con un nombre corto. Por eso `<svc>` solo funciona en tu namespace.\n- `nameserver`: la IP del Service de CoreDNS (`kube-dns`). La IP concreta depende del cluster.\n- `ndots:5`: un nombre con menos de 5 puntos se prueba antes con los sufijos de `search`. Los nombres externos generan varias consultas extra; acabarlos en punto (`ejemplo.com.`) lo evita.\n\n## Probar desde dentro del cluster\n\n```bash\n# Pod de usar y tirar (busybox trae nslookup y wget; no trae curl)\nkubectl run prueba --rm -it --image=busybox:1.37 -n <ns> -- nslookup <svc>\nkubectl run prueba --rm -it --image=busybox:1.37 -n <ns> -- wget -qO- -T 3 http://<svc>\nkubectl run prueba --rm -it --image=busybox:1.37 -n <ns> -- cat /etc/resolv.conf\n\n# Desde un Pod que ya existe\nkubectl exec deploy/<app> -n <ns> -- nslookup <svc>.<otro-ns>\n```\n\n| Resultado | Diagnóstico |\n|---|---|\n| `bad address` o `NXDOMAIN` | El nombre no existe: errata, o falta el namespace |\n| `connection timed out; no servers could be reached` | CoreDNS no responde: `kubectl get deploy coredns -n kube-system` |\n| `connection refused` | Llega, pero nadie escucha en ese puerto (`targetPort`) |\n| `download timed out` (wget) | NetworkPolicy, o el Pod destino no responde |\n\n## port-forward: probar sin publicar nada\n\n```bash\nkubectl port-forward svc/<svc> 8080:80 -n <ns>    # local:remoto; se queda abierto hasta Ctrl+C\ncurl http://localhost:8080                        # en OTRA terminal\n```\n\nAdmite `svc/`, `pod/` y `deployment/`. El túnel va por la API de Kubernetes: no abre nada a Internet. Es la forma segura de mirar un servicio interno.\n\n## NetworkPolicy\n\nPor defecto, **todo Pod puede hablar con todo Pod**, de cualquier namespace. Una NetworkPolicy que selecciona un Pod lo cierra para todo lo que no permita explícitamente.\n\n| Concepto | Detalle |\n|---|---|\n| `podSelector` | A qué Pods del namespace se aplica (`{}` = todos) |\n| `policyTypes: [Ingress]` | Controla lo que entra; `Egress`, lo que sale |\n| `ingress.from.podSelector` | Desde qué Pods (del mismo namespace) se permite |\n| `ingress.from.namespaceSelector` | Desde qué namespaces |\n| Varias políticas | Se suman: lo que permita cualquiera, pasa |\n\nPatrón de mínimo privilegio: una política \"denegar todo\" y otras que permitan solo lo necesario. Plantillas en CHULETA-YAML.\n\n```bash\nkubectl get netpol -n <ns>\nkubectl describe netpol <nombre> -n <ns>\n```\n\n⚠️ En EKS las NetworkPolicies solo se cumplen si la VPC CNI tiene activado su soporte (`enableNetworkPolicy: \"true\"` en la configuración del addon `vpc-cni`; capítulo 06 del curso). Sin él, el cluster acepta los objetos pero no los aplica: todo sigue pasando.\n\n```bash\naws eks describe-addon --cluster-name <cluster> --addon-name vpc-cni --query addon.configurationValues\n```\n\n## Cómo funciona un Service por debajo (kube-proxy)\n\nUn Service no es un proceso ni tiene interfaz de red: en cada nodo, kube-proxy (modo iptables en EKS) escribe reglas:\n\n```text\nKUBE-SERVICES  -d <ClusterIP>/32 --dport <port>   → KUBE-SVC-XXXX\nKUBE-SVC-XXXX  (reparto al azar: --probability)    → KUBE-SEP-AAAA · KUBE-SEP-BBBB …  (uno por endpoint)\nKUBE-SEP-AAAA  DNAT --to-destination <ip-pod>:<targetPort>\n```\n\n```bash\nkubectl debug node/<nodo> -it --image=busybox:1.37\niptables-save | grep <service>          # o: iptables -t nat -L KUBE-SERVICES -n\n```\n\nSi no hay endpoints, la regla es un `REJECT`: por eso un Service sin Pods listos da «Connection refused» al instante.\n\n## VPC CNI: cada Pod tiene una IP de la VPC\n\nEn EKS, el addon `vpc-cni` (DaemonSet `aws-node`) da a cada Pod una IP real de la subnet. Por eso el máximo de Pods por nodo lo marca la red:\n\n```text\nmax Pods = ENIs × (IPs por ENI − 1) + 2\nt3.medium: 3 × (6 − 1) + 2 = 17\nt3.large:  3 × (12 − 1) + 2 = 35\n```\n\nLos \"+2\" son Pods que usan la red del propio nodo (`aws-node` y `kube-proxy`).\n\n```bash\nkubectl get node <nodo> -o jsonpath='{.status.allocatable.pods}'\nkubectl get ds aws-node -n kube-system\n```\n\nConsecuencias: `Too many pods` aunque sobre CPU, y subnets que se quedan sin IPs (`failed to assign an IP address to container`). La *prefix delegation* sube ese máximo (capítulo 07 del curso).\n\n## LoadBalancer en EKS\n\n| Cómo | Qué crea | Notas |\n|---|---|---|\n| Service `type: LoadBalancer` sin controlador extra | Un balanceador de AWS creado por el cloud provider de EKS |
